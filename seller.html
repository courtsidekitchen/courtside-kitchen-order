<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Seller Portal v3</title><style>body{font-family:Arial;max-width:1100px;margin:auto;padding:20px;background:#f4f6f9}.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}input{width:100%;padding:10px;margin:5px 0;box-sizing:border-box}button{padding:10px 15px;margin:5px}.hidden{display:none}</style></head><body>
<div id='loginWrap' class='card'><h2>Seller Login</h2><input id='passwordInput' type='password'><button onclick='login()'>Login</button></div>
<div id='app' class='hidden'>
<div class='card'><h2>Add / Edit Product</h2>
<input id='fldCategory' placeholder='Category'>
<input id='fldProductName' placeholder='Product Name'>
<input id='fldDescription' placeholder='Description'>
<input id='fldPrice' type='number' placeholder='Price'>
<input id='fldQty' type='number' placeholder='Quantity'>
<input id='fldImage' placeholder='images/product.jpg'>
<label><input id='fldOut' type='checkbox'> Out of Stock</label><br>
<button onclick='saveProduct()'>Save Product</button>
<button onclick='resetForm()'>Clear</button></div>
<div class='card'><h2>Products</h2><div id='productList'></div></div>
<div class='card'><input type='file' id='jsonFile'><button onclick='importJSON()'>Import</button><button onclick='exportJSON()'>Export products.json</button></div>
</div>
<script>
const PASS='pickleball123';let products=JSON.parse(localStorage.getItem('ck_products_v3')||'[]');let editIndex=-1;
function saveStore(){localStorage.setItem('ck_products_v3',JSON.stringify(products));}
function login(){if(document.getElementById('passwordInput').value!==PASS){alert('Invalid password');return;}document.getElementById('loginWrap').style.display='none';document.getElementById('app').classList.remove('hidden');render();}
function saveProduct(){const product={category:document.getElementById('fldCategory').value.trim(),name:document.getElementById('fldProductName').value.trim(),description:document.getElementById('fldDescription').value.trim(),price:Number(document.getElementById('fldPrice').value||0),qty:Number(document.getElementById('fldQty').value||0),image:document.getElementById('fldImage').value.trim(),outOfStock:document.getElementById('fldOut').checked};if(product.name.length===0){alert('Product name required');return;}if(editIndex>=0){products[editIndex]=product;}else{products.push(product);}editIndex=-1;saveStore();resetForm();render();alert('Saved');}
function render(){document.getElementById('productList').innerHTML=products.map((p,i)=>`<div><b>${p.name}</b> (${p.category}) - ₱${p.price} - Qty ${p.qty} ${p.outOfStock?'❌ OUT OF STOCK':''}<br><button onclick="editProduct(${i})">Edit</button><button onclick="deleteProduct(${i})">Delete</button><hr></div>`).join('')||'No products';}
function editProduct(i){const p=products[i];editIndex=i;fldCategory.value=p.category||'';fldProductName.value=p.name||'';fldDescription.value=p.description||'';fldPrice.value=p.price||0;fldQty.value=p.qty||0;fldImage.value=p.image||'';fldOut.checked=!!p.outOfStock;}
function deleteProduct(i){if(confirm('Delete product?')){products.splice(i,1);saveStore();render();}}
function resetForm(){['fldCategory','fldProductName','fldDescription','fldPrice','fldQty','fldImage'].forEach(id=>document.getElementById(id).value='');fldOut.checked=false;}
function exportJSON(){const blob=new Blob([JSON.stringify(products,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='products.json';a.click();}
function importJSON(){const f=document.getElementById('jsonFile').files[0];if(!f){alert('Choose file');return;}const r=new FileReader();r.onload=e=>{products=JSON.parse(e.target.result);saveStore();render();alert('Imported');};r.readAsText(f);}
</script></body></html>

<script type='module'>
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore, collection, onSnapshot, doc, updateDoc, setDoc, deleteDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {getMessaging, getToken, onMessage} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js';

const app = initializeApp({
  apiKey:'AIzaSyDRCXXhgQrMNan2lK-5WN1f5fcXBdzHj2I',
  authDomain:'courtside-kitchen.firebaseapp.com',
  projectId:'courtside-kitchen',
  messagingSenderId:'1062967764463'
});
const auth = getAuth(app);
const db = getFirestore(app);

let messaging = null;
try {
  messaging = getMessaging(app);
} catch (e) {
  console.log("FCM Messaging not supported in this browser context:", e);
}

let hist=[]; let products=[]; let existingOrderIds=new Set(); let isFirstLoad=true;
let unsubscribeOrders = null;
let unsubscribeProducts = null;

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/firebase-messaging-sw.js')
    .then(reg => console.log('SW Registered:', reg.scope))
    .catch(err => console.error('SW Fail:', err));
}

window.enableAudio = async () => {
  const audio = document.getElementById('notifSound');
  try {
    await audio.play();
    audio.pause();
    audio.currentTime = 0;
  } catch(e){ console.log(e); }

  try {
    const permission = await Notification.requestPermission();
    if (permission === 'granted' && messaging) {
      const token = await getToken(messaging, { 
        vapidKey: 'BJG9Bk5PYa94XJRE4qx69eQ9T74jMuoBCH-SrBYUJdThJU41BG0SRhoZJ8HwDmuoR1LmaEFlW12TvscH9qqzjWI' 
      });
      await setDoc(doc(db, 'seller_tokens', 'android_device'), { token: token, updatedAt: new Date().toISOString() });
      const btn = document.getElementById('enableAudioBtn');
      btn.textContent = '🔔 Notifications Enabled ✓';
      btn.style.background = '#4caf50';
    } else if (!messaging) {
      alert('Messaging is not supported on this browser.');
    } else {
      alert('Notification permissions were blocked in your browser settings.');
    }
  } catch (err) {
    console.error('Push error:', err);
    alert('Push notification error: ' + err.message);
  }
};

if (messaging) {
  onMessage(messaging, (payload) => {
    playSound();
  });
}

window.login = async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const errorEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  if(!email || !password){
    errorEl.textContent = 'Please enter both email and password';
    errorEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Logging in...';
  errorEl.style.display = 'none';

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    errorEl.textContent = error.message.replace('Firebase: ', '');
    errorEl.style.display = 'block';
    alert("Login Error: " + error.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '🔒 Log In';
  }
};

window.logout = async () => {
  if(confirm('Are you sure you want to log out?')){
    await signOut(auth);
  }
};

onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    startRealtimeListeners();
  } else {
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
    if(unsubscribeOrders) unsubscribeOrders();
    if(unsubscribeProducts) unsubscribeProducts();
    isFirstLoad = true;
  }
});

function playSound(){
  const audio=document.getElementById('notifSound');
  audio.currentTime=0;
  audio.play().catch(e=>console.log('Autoplay prevented:',e));
}

window.tab=id=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')};
window.move=(id,s)=>updateDoc(doc(db,'orders',id),{status:s});
window.decline=async(id)=>{let r=prompt('Reason');if(r) await updateDoc(doc(db,'orders',id),{status:'DECLINED',declineReason:r});};
window.exportCsv=()=>{let rows=['Order,Customer,Status,Total'];hist.forEach(o=>rows.push(`${o.orderNumber},${o.customerName},${o.status},${o.total}`));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='orders.csv';a.click()};
function remain(created){if(!created)return '';const d=Math.max(0,30-Math.floor((Date.now()-new Date(created))/1000));return d+'s';}
function itemsHtml(items=[]){return items.map(i=>`${i.name} x${i.qty}${i.boba?' + Boba':''}`).join('<br>');}
function card(id,o){return `<div class='card'><b>${o.orderNumber||id}</b><br>Customer: ${o.customerName||''}<br>${o.status==='PENDING'?`Pending: ${remain(o.createdAt)}`:''}<div class='items'>${itemsHtml(o.items)}</div>Total: ₱${o.total}<br>${o.status!=='COMPLETED'&&o.status!=='DECLINED'?`<div class='button-group'><button onclick="move('${id}','ORDER_RECEIVED')">✅ Receive Order</button><button onclick="move('${id}','PREPARING')" style="background:#ff9800">👨‍🍳 Preparing</button><button onclick="move('${id}','COMPLETED')" style="background:#4caf50">🎉 Complete</button><button onclick="decline('${id}')" style="background:#f44336">❌ Decline</button></div>`:o.status==='DECLINED'?`<b style='color:red'>DECLINED: ${o.declineReason}</b>`:''}</div>`;}

window.toggleAdd = () => {
  const box = document.getElementById('addBox');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
};

function slug(s){
  return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

window.addProduct = async() => {
  const category = document.getElementById('aCategory').value.trim();
  const name = document.getElementById('aName').value.trim();
  const description = document.getElementById('aDescription').value.trim();
  const price = document.getElementById('aPrice').value.trim();
  const qty = document.getElementById('aQty').value.trim();
  const image = document.getElementById('aImage').value.trim();

  if(!name) return alert('Product name required');

  await setDoc(doc(db,'products',slug(name)),{
    category: category,
    name: name,
    description: description,
    price: Number(price || 0),
    qty: Number(qty || 0),
    image: image
  });

  document.getElementById('aCategory').value = '';
  document.getElementById('aName').value = '';
  document.getElementById('aDescription').value = '';
  document.getElementById('aPrice').value = '';
  document.getElementById('aQty').value = '';
  document.getElementById('aImage').value = '';
  toggleAdd();

  alert('Product saved!');
};

window.saveProduct = async(id) => {
  await setDoc(doc(db,'products',id),{
    category: document.getElementById('c_'+id).value,
    name: document.getElementById('n_'+id).value,
    description: document.getElementById('d_'+id).value,
    price: Number(document.getElementById('p_'+id).value),
    qty: Number(document.getElementById('q_'+id).value),
    image: document.getElementById('i_'+id).value
  },{merge:true});
  alert('Updated');
};

window.deleteProduct = async(id) => {
  if(confirm('Delete Product?')){
    await deleteDoc(doc(db,'products',id));
  }
};

window.editProduct = id => {
  document.getElementById('e_'+id).classList.toggle('active');
};

window.renderProducts = () => {
  const q = (searchProducts?.value || '').toLowerCase();
  let h='';
  products.filter(p => (p.name||'').toLowerCase().includes(q)).forEach(p => {
    h += `
    <div class='card'>
    ${p.image ? `<img src='${p.image}' style='max-width:100%;border-radius:4px'><br>` : ''}
    <b>${p.name}</b><br>
    ₱${p.price||0}<br>
    Qty: ${p.qty||0}
    ${(p.qty||0)<=0 ? "<div style='color:red;font-weight:bold'>❌ OUT OF STOCK</div>" : ""}
    <br><br>
    <button onclick="editProduct('${p.id}')">Edit</button>
    <button onclick="deleteProduct('${p.id}')">Delete</button>
    <div id="e_${p.id}" class="tab">
    <input id="c_${p.id}" value="${p.category||''}">
    <input id="n_${p.id}" value="${p.name||''}">
    <input id="d_${p.id}" value="${p.description||''}">
    <input id="p_${p.id}" value="${p.price||0}">
    <input id="q_${p.id}" value="${p.qty||0}">
    <input id="i_${p.id}" value="${p.image||''}">
    <button onclick="saveProduct('${p.id}')">Save</button>
    </div>
    </div>
    `;
  });

  let cats = new Set();
  let out = 0;
  products.forEach(p => {
    cats.add(p.category || 'Other');
    if((p.qty || 0) <= 0){ out++; }
  });

  prodCount.textContent = products.length;
  outCount.textContent = out;
  catCount.textContent = cats.size;
  productsList.innerHTML = h;
};

function startRealtimeListeners() {
  unsubscribeProducts = onSnapshot(collection(db,'products'),snap => {
    products=[];
    snap.forEach(d => products.push({id:d.id,...d.data()}));
    renderProducts();
  });

  unsubscribeOrders = onSnapshot(collection(db,'orders'),snap=>{
    let p='',r='',pr='',re='',h='';
    let revenue=0,c=0;
    let hasNewOrder=false;
    hist=[];

    snap.forEach(d=>{
      const o={id:d.id,...d.data()};
      hist.push(o);

      if(!isFirstLoad && !existingOrderIds.has(d.id) && (o.status==='PENDING' || o.status==='ORDER_RECEIVED')){
        hasNewOrder=true;
      }

      if(o.status==='COMPLETED'){revenue+=o.total||0;c++;}
      h+=card(d.id,o);
      if(o.status==='PENDING')p+=card(d.id,o);
      else if(o.status==='ORDER_RECEIVED')r+=card(d.id,o);
      else if(o.status==='PREPARING')pr+=card(d.id,o);
      else if(o.status==='COMPLETED')re+=card(d.id,o);
    });

    if(hasNewOrder){
      playSound();
    }

    existingOrderIds=new Set(snap.docs.map(d=>d.id));
    isFirstLoad=false;

    pending.innerHTML=p;
    received.innerHTML=r;
    preparing.innerHTML=pr;
    completed.innerHTML=re;
    historyList.innerHTML=h;
    rev.textContent=revenue;
    cnt.textContent=c;
    avg.textContent=c?Math.round(revenue/c):0;
  });
}
</script>

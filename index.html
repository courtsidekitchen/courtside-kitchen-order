<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Courtside Kitchen</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6f9}header{background:#163a70;color:#fff;text-align:center;padding:16px}.container{max-width:900px;margin:auto;padding:12px}.card{background:#fff;padding:12px;border-radius:12px;margin-bottom:12px}.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0}.qty button{width:32px}.cart{position:sticky;bottom:0;background:#fff;padding:12px;border-top:4px solid #163a70}.subcategory{color:#163a70;font-weight:bold;margin-top:10px}.hidden{display:none}.qr{max-width:220px;width:100%}.order{width:100%;padding:12px;background:#163a70;color:#fff;border:none;border-radius:8px}
</style>
</head>
<body>
<header><h1>Courtside Kitchen</h1></header>
<div class='container'>
<div id='menu'></div>
<div class='card'>
<input id='name' placeholder='Name' style='width:100%;padding:8px'><br>
<input id='mobile' placeholder='Mobile Number' style='width:100%;padding:8px'><br>
<select id='payment' onchange='payChange()' style='width:100%;padding:8px'><option>GCash</option><option>BPI</option></select>
<div id='g'><img class='qr' src='GCASH.jpg'><p><b>GCash</b><br>PA****K NI**O L.<br>09178512376</p></div>
<div id='b' class='hidden'><img class='qr' src='BPI.jpg'><p><b>BPI</b><br>PA****K NI**O LA***O.<br>0846454643</p></div>
<input id='ref' placeholder='Payment Reference Number' style='width:100%;padding:8px'>
<div style='background:#fff8e1;padding:10px;margin-top:10px'>📸 After clicking PLACE ORDER, Messenger will open. Send your payment screenshot and payment reference number via Messenger.<br><b style='color:red'>⚠️ Only confirmed paid orders will be processed.</b></div>
</div></div>
<div class='cart'><div id='summary'>No items selected</div><h2>Total ₱<span id='total'>0</span></h2><button class='order' onclick='placeOrder()'>PLACE ORDER</button></div>
<script>
const menu={
'Fruit Shakes':[['Mango Smash',150],['Melon Match Point',150],['Strawberry Rally',150],['Watermelon Winner',150],['Banana Serve',150]],
'Fruit Sodas':[['Strawberry Serve Fizz',100],['Peach Drop Shot',100]],
'Milk Tea':[['Sweet Spot Okinawa',95,true],['Grand Slam Choco',95,true],['Baseline Matcha',95,true],['Nutty Dink Delight',95,true]],
'Quick Points':[['Paddle Popper Combo',180],['Courtside Cheese Steak Sandwich',270],['The Third Shot Sausage',150],['Hungarian Slice',100],['Sideout Sticks',120],['Golden Dink Fries',100]],
'Power Plays':[['Tapa Topspin Bowl',220],['Sweet Serve Tocino',200],['Spam Smash Bowl',200],['Slice Serve Sisig',200],['Hungarian Heavy Hit',180],['Courtside Cheese Steak Rice Bowl',270]]};
let cart={},boba={};
function chg(n,v){cart[n]=Math.max(0,(cart[n]||0)+v);render();}
function payChange(){g.classList.toggle('hidden',payment.value!=='GCash');b.classList.toggle('hidden',payment.value!=='BPI');}
function render(){let h='',t=0,s='';for(let c in menu){h+=`<div class='card'><div class='subcategory'>${c}</div>`;menu[c].forEach(i=>{let q=cart[i[0]]||0;let bb=boba[i[0]]||false;let price=i[1]+(bb?5:0);h+=`<div class='item'><div><b>${i[0]}</b><br>₱${i[1]} ${i[2]?`<br><label><input type='checkbox' ${bb?'checked':''} onchange="boba['${i[0]}']=this.checked;render();"> Add Boba (+₱5)</label>`:''}</div><div><button onclick="chg('${i[0]}',-1)">-</button>${q}<button onclick="chg('${i[0]}',1)">+</button></div></div>`;if(q){t+=q*price;s+=i[0]+(bb?' + Boba':'')+' x'+q+'<br>';}});h+='</div>';}menuDiv.innerHTML=h;summary.innerHTML=s||'No items selected';total.innerText=t;}
function placeOrder(){if(!ref.value.trim()){alert('Please enter payment reference number');return;}window.open('https://m.me/1282294331624336','_blank');}
const menuDiv=document.getElementById('menu');payChange();render();
</script></body></html>

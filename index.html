<!DOCTYPE html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Courtside Kitchen Ordering</title><style>body{font-family:Arial;margin:0;background:#f4f6f9}.logo-container{text-align:center;padding:20px}.logo{max-width:350px;width:100%}.container{max-width:900px;margin:auto;padding:12px}.card{background:#fff;padding:12px;border-radius:12px;margin-bottom:12px}.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0}.subcategory{color:#163a70;font-weight:bold}.cart{position:sticky;bottom:0;background:#fff;padding:12px;border-top:4px solid #163a70}.hidden{display:none}.out{color:red;font-weight:bold}.order{width:100%;padding:12px;background:#163a70;color:#fff;border:none;border-radius:8px}</style></head><body>
<div class='logo-container'><img src='logo.png' class='logo'></div>
<div class='container'><div id='menu'></div><div class='card'><input id='name' placeholder='Name' style='width:100%;padding:8px'><br><br><select id='payment' style='width:100%;padding:8px' onchange='payChange()'><option>GCash</option><option>BPI</option></select><div id='g'><img src='GCASH.jpg' style='max-width:220px;width:100%'></div><div id='b' class='hidden'><img src='BPI.jpg' style='max-width:220px;width:100%'></div></div></div>
<div class='cart'><div id='summary'>No items selected</div><h2>Total ₱<span id='total'>0</span></h2><button class='order' onclick='placeOrder()'>📱 PLACE ORDER VIA WHATSAPP</button></div>
<script>
let products=[],cart={};
function payChange(){document.getElementById('g').classList.toggle('hidden',payment.value!=='GCash');document.getElementById('b').classList.toggle('hidden',payment.value!=='BPI');}
async function loadProducts(){const r=await fetch('products.json');products=await r.json();render();}
function qtyChange(n,v){cart[n]=Math.max(0,(cart[n]||0)+v);render();}
function render(){let grouped={},html='',totalAmt=0,sum='';products.forEach(p=>{if(!grouped[p.category])grouped[p.category]=[];grouped[p.category].push(p)});for(const cat in grouped){html+=`<div class='card'><div class='subcategory'>${cat}</div>`;grouped[cat].forEach(p=>{const q=cart[p.name]||0;const disabled=p.outOfStock||p.qty<=0;html+=`<div class='item'><div><b>${p.name}</b><br><small>${p.description}</small><br>₱${p.price}<br>${disabled?'<span class="out">❌ OUT OF STOCK</span>':'Qty: '+p.qty}</div><div>${disabled?'':`<button onclick="qtyChange('${p.name}',-1)">-</button>${q}<button onclick="qtyChange('${p.name}',1)">+</button>`}</div></div>`;if(q){totalAmt+=q*p.price;sum+=`${p.name} x${q}\n`;}});html+='</div>';}menu.innerHTML=html;summary.innerText=sum||'No items selected';total.innerText=totalAmt;}
function placeOrder(){const n=name.value.trim();if(!n)return alert('Enter name');if(parseFloat(total.innerText)<=0)return alert('Select item(s)');const ts=new Date().toLocaleString('en-PH');const msg=`🍽️ COURTSIDE KITCHEN ORDER\n\nName: ${n}\nDate: ${ts}\n\nItems:\n${summary.innerText}\nTotal: ₱${total.innerText}\nPayment: ${payment.value}`;location.href=`https://wa.me/639178512376?text=${encodeURIComponent(msg)}`;}
payChange();loadProducts();
</script></body></html>

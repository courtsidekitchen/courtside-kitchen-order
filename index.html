<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Courtside Kitchen</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f9}header{background:#163a70;color:#fff;text-align:center;padding:16px}header img{max-width:180px}.container{padding:12px;max-width:900px;margin:auto}.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 2px 5px rgba(0,0,0,.1)}.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee}button{cursor:pointer}.qty button{width:34px;height:34px}.cart{position:sticky;bottom:0;background:#fff;padding:12px;border-top:4px solid #163a70}.order{width:100%;padding:14px;background:#163a70;color:#fff;border:none;border-radius:8px;font-weight:bold}input,select{width:100%;padding:10px;margin:6px 0}.qr{max-width:220px;width:100%}.progress{height:18px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:#163a70}.hidden{display:none}</style></head><body><header><img src='logo.png' onerror='this.style.display="none"'><h1>Courtside Kitchen</h1></header><div class='container'><div id='menu'></div><div class='card'><h3>Details</h3><input id='name' placeholder='Name'><input id='mobile' placeholder='Mobile Number'><select id='location'><option>VIP Court 1</option><option>VIP Court 2</option><option>VIP Lounge</option></select><select id='payment' onchange='payChange()'><option>GCash</option><option>BPI</option><option>Cash</option></select><div id='g'><img class='qr' src='GCASH.jpg'></div><div id='b' class='hidden'><img class='qr' src='BPI.jpg'></div><input id='ref' placeholder='Payment Reference Number'></div></div><div class='cart'><div id='summary'>No items selected</div><h2>Total ₱<span id='total'>0</span></h2><button id='orderBtn' class='order' onclick='placeOrder()'>🍽️ PLACE ORDER</button><div id='loader' class='hidden'><p>Preparing your order...</p><div class='progress'><div id='bar' class='bar'></div></div><button onclick='cancelOrder()'>Cancel</button></div><div id='success' class='hidden'>✅ Messenger opened. Please tap SEND to complete your order.</div></div><script>const PAGE='https://m.me/1282294331624336';const menu={'🥤 Refresh Between Sets':[['Mango Smash',150],['Melon Match Point',150],['Strawberry Rally',150],['Watermelon Winner',150],['Strawberry Serve Fizz',100],['Peach Drop Shot',100],['Sweet Spot Okinawa',100],['Grand Slam Choco',100],['Baseline Matcha',100],['Nutty Dink Delight',100],['Banana Serve',150]],'🍟 Quick Points':[['Paddle Popper Combo',180],['Courtside Cheese Steak',270],['The Third Shot Sausage',150],['Hungarian Slice',100],['Sideout Sticks',120],['Golden Dink Fries',100]],'🍚 Power Plays':[['Tapa Topspin Bowl',220],['Sweet Serve Tocino',200],['Spam Smash Bowl',200],['Slice Serve Sisig',200],['Hungarian Heavy Hit',180]]};let cart={};function render(){let h='',t=0,s='';for(const c in menu){h+=`<div class=card><h2>${c}</h2>`;menu[c].forEach(i=>{let q=cart[i[0]]||0;h+=`<div class=item><span>${i[0]} ₱${i[1]}</span><span class=qty><button onclick="chg('${i[0]}',-1)">-</button> ${q} <button onclick="chg('${i[0]}',1)">+</button></span></div>`;if(q){t+=q*i[1];s+=`${i[0]} x${q}<br>`}});h+='</div>';}menuEl.innerHTML=h;summary.innerHTML=s||'No items selected';total.innerText=t;}function chg(n,v){cart[n]=Math.max(0,(cart[n]||0)+v);render()}function payChange(){let p=payment.value;g.classList.toggle('hidden',p!=='GCash');b.classList.toggle('hidden',p!=='BPI');ref.style.display=p==='Cash'?'none':'block'}let iv,to;function placeOrder(){orderBtn.style.display='none';loader.classList.remove('hidden');let p=0;iv=setInterval(()=>{p+=2;bar.style.width=p+'%'},100);to=setTimeout(()=>{clearInterval(iv);loader.classList.add('hidden');success.classList.remove('hidden');window.open(PAGE,'_blank');orderBtn.style.display='block';},5000)}function cancelOrder(){clearInterval(iv);clearTimeout(to);loader.classList.add('hidden');bar.style.width='0%';orderBtn.style.display='block'}const menuEl=document.getElementById('menu');payChange();render();</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Courtside Kitchen Menu</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#ececec;margin:0;padding:12px;color:#333}
.container{max-width:600px;margin:0 auto}

/* Header & Cart Bar */
.cart-bar{position:sticky;top:0;z-index:100;background:#0066cc;color:#fff;padding:12px 16px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.cart-bar h2{margin:0;font-size:18px}
.cart-bar button{background:#fff;color:#0066cc;border:none;padding:8px 14px;border-radius:6px;font-weight:bold;cursor:pointer}

/* Category Headers */
.category-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,0.05)}
.category-header{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:18px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #f0f0f0}

/* Item Row Layout (Flexbox Row Fix) */
.item-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0f0}
.item-row:last-child{border-bottom:none}

/* Item Left Details */
.item-details{display:flex;flex-direction:column;gap:4px;flex:1;padding-right:12px}
.item-name{font-weight:bold;font-size:16px;color:#222}
.item-desc{font-size:12px;color:#777}
.item-price{color:#0066cc;font-weight:bold;font-size:15px}
.item-opt{font-size:12px;color:#555;display:flex;align-items:center;gap:4px;margin-top:2px;cursor:pointer}

/* Item Right Controls */
.item-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn-qty{width:32px;height:32px;background:#0066cc;color:#fff;border:none;border-radius:6px;font-size:18px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-qty:active{background:#004c99}
.qty-display{width:36px;height:32px;text-align:center;border:1px solid #ccc;border-radius:6px;font-size:14px;font-weight:bold;line-height:30px;background:#fff}

/* Modal Overlay */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center}
.modal-content{background:#fff;padding:20px;border-radius:12px;width:90%;max-width:400px;box-shadow:0 4px 15px rgba(0,0,0,0.2)}
.modal-content h3{margin-top:0}
.modal-content input{width:100%;padding:10px;margin:8px 0 16px 0;border:1px solid #ccc;border-radius:6px;font-size:14px}
.modal-actions{display:flex;gap:10px}
.modal-actions button{flex:1;padding:12px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
.btn-checkout{background:#4caf50;color:#fff}
.btn-cancel{background:#f44336;color:#fff}
</style>
</head>
<body>

<div class="container">
  <div class="cart-bar">
    <h2>Courtside Kitchen</h2>
    <button onclick="openCheckout()">Checkout (<span id="cartCount">0</span>)</button>
  </div>

  <div id="menuContainer">Loading menu...</div>
</div>

<div id="checkoutModal" class="modal">
  <div class="modal-content">
    <h3>Complete Your Order</h3>
    <p>Total: <b>₱<span id="modalTotal">0</span></b></p>
    <label>Your Name:</label>
    <input id="customerName" type="text" placeholder="Enter your full name">
    <div class="modal-actions">
      <button class="btn-checkout" id="submitBtn" onclick="submitOrder()">Submit Order</button>
      <button class="btn-cancel" onclick="closeCheckout()">Cancel</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, onSnapshot, addDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyDRCXXhgQrMNan2lK-5WN1f5fcXBdzHj2I',
  authDomain: 'courtside-kitchen.firebaseapp.com',
  projectId: 'courtside-kitchen',
  storageBucket: 'courtside-kitchen.appspot.com',
  messagingSenderId: '1062967764463',
  appId: '1:1062967764463:web:0b6dbbfec0904d0f0c05a1'
});

const db = getFirestore(app);

let products = [];
let cart = {};

// Listen for products from Firestore database
onSnapshot(collection(db, 'products'), (snap) => {
  products = [];
  snap.forEach(doc => {
    products.push({ id: doc.id, ...doc.data() });
  });
  renderMenu();
});

function renderMenu() {
  const container = document.getElementById('menuContainer');
  if (products.length === 0) {
    container.innerHTML = '<p style="text-align:center;">No products available.</p>';
    return;
  }

  // Group products by category
  const categories = {};
  products.forEach(p => {
    const cat = p.category || 'General';
    if (!categories[cat]) categories[cat] = [];
    categories[cat].push(p);
  });

  let html = '';
  for (const [catName, items] of Object.entries(categories)) {
    html += `
      <div class="category-card">
        <div class="category-header">
          <span>${catName}</span>
          <span style="font-size:14px;color:#666;">${items.length}</span>
        </div>
    `;

    items.forEach(item => {
      const cartKey = item.id;
      const currentQty = cart[cartKey] ? cart[cartKey].qty : 0;
      const hasBoba = cart[cartKey] ? cart[cartKey].boba : false;
      const isMilkTea = catName.toLowerCase().includes('tea') || (item.name && item.name.toLowerCase().includes('matcha'));

      html += `
        <div class="item-row">
          <div class="item-details">
            <div class="item-name">${item.name}</div>
            ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
            <div class="item-price">₱${item.price || 0}</div>
            ${isMilkTea ? `
              <label class="item-opt">
                <input type="checkbox" ${hasBoba ? 'checked' : ''} onchange="window.toggleBoba('${item.id}', this.checked)"> Boba +₱5
              </label>
            ` : ''}
          </div>
          <div class="item-controls">
            <button class="btn-qty" onclick="window.updateQty('${item.id}', -1)">-</button>
            <div class="qty-display">${currentQty}</div>
            <button class="btn-qty" onclick="window.updateQty('${item.id}', 1)">+</button>
          </div>
        </div>
      `;
    });

    html += `</div>`;
  }

  container.innerHTML = html;
  updateCartBar();
}

window.updateQty = (id, change) => {
  const prod = products.find(p => p.id === id);
  if (!prod) return;

  if (!cart[id]) {
    cart[id] = { id: prod.id, name: prod.name, price: Number(prod.price || 0), qty: 0, boba: false };
  }

  cart[id].qty += change;

  if (cart[id].qty <= 0) {
    delete cart[id];
  }

  renderMenu();
};

window.toggleBoba = (id, isChecked) => {
  if (cart[id]) {
    cart[id].boba = isChecked;
  } else {
    const prod = products.find(p => p.id === id);
    if (prod) {
      cart[id] = { id: prod.id, name: prod.name, price: Number(prod.price || 0), qty: 1, boba: isChecked };
    }
  }
  renderMenu();
};

function calculateTotal() {
  let total = 0;
  Object.values(cart).forEach(item => {
    const unitPrice = item.price + (item.boba ? 5 : 0);
    total += unitPrice * item.qty;
  });
  return total;
}

function updateCartBar() {
  let count = 0;
  Object.values(cart).forEach(item => count += item.qty);
  document.getElementById('cartCount').textContent = count;
}

window.openCheckout = () => {
  const total = calculateTotal();
  if (total <= 0) {
    alert('Please select at least one item.');
    return;
  }
  document.getElementById('modalTotal').textContent = total;
  document.getElementById('checkoutModal').style.display = 'flex';
};

window.closeCheckout = () => {
  document.getElementById('checkoutModal').style.display = 'none';
};

window.submitOrder = async () => {
  const nameInput = document.getElementById('customerName').value.trim();
  if (!nameInput) {
    alert('Please enter your name.');
    return;
  }

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending...';

  const orderItems = Object.values(cart).map(i => ({
    id: i.id,
    name: i.name,
    qty: i.qty,
    price: i.price,
    boba: i.boba || false
  }));

  try {
    await addDoc(collection(db, 'orders'), {
      customerName: nameInput,
      items: orderItems,
      total: calculateTotal(),
      status: 'PENDING',
      createdAt: new Date().toISOString(),
      orderNumber: 'ORD-' + Math.floor(1000 + Math.random() * 9000)
    });

    alert('Order sent successfully!');
    cart = {};
    document.getElementById('customerName').value = '';
    closeCheckout();
    renderMenu();
  } catch (err) {
    alert('Failed to send order: ' + err.message);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit Order';
  }
};
</script>
</body>
</html>

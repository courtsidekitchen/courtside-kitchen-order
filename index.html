<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Courtside Kitchen Ordering v5</title>
<style>
body{font-family:Arial;margin:0;background:#ececec}.logo{text-align:center;padding:25px 0}.logo img{max-width:420px;width:100%;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}.container{max-width:1100px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px rgba(0,0,0,.06)}.img{width:90px;height:90px;border-radius:10px;object-fit:cover}.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.category-header{background:#163a70;color:#fff;padding:14px 16px;border-radius:12px;display:flex;justify-content:space-between;cursor:pointer;font-weight:bold}.category-content{max-height:0;overflow:hidden;transition:max-height .35s ease}.category-content.open{max-height:5000px}.qty-controls{display:flex;align-items:center;gap:14px}.qty-btn{width:46px;height:46px;border:none;border-radius:10px;color:#fff;font-size:22px;font-weight:bold}.minus-btn{background:#dc3545}.plus-btn{background:#28a745}.cart{position:sticky;bottom:0;background:#fff;padding:12px;border-top:4px solid #163a70}.btn{background:#163a70;color:#fff;border:none;padding:18px;border-radius:12px;width:100%;font-size:20px;font-weight:bold}.out{color:red;font-weight:bold}
</style></head><body>
<div class='logo'><img src='logo.png'></div>
<div class='container'><div id='menu'></div><div class='card'><input id='customerName' placeholder='Name' style='width:100%;padding:10px'><br><br><textarea id='notes' placeholder='Special Requests / Notes' style='width:100%;height:80px'></textarea><br><br><select id='payment' style='width:100%;padding:10px'><option>GCash</option><option>BPI</option></select></div><div id='successBox' class='card' style='display:none'></div></div>
<div class='cart'><div id='summary'>No items selected</div><h2>Total ₱<span id='total'>0</span></h2><button class='btn' onclick='placeOrder()'>🍽️ PLACE ORDER</button></div>
<script type='module'>
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,collection,onSnapshot,doc,runTransaction,setDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyDRCXXhgQrMNan2lK-5WN1f5fcXBdzHj2I',authDomain:'courtside-kitchen.firebaseapp.com',projectId:'courtside-kitchen'});const db=getFirestore(app);
let products=[],cart={};
window.toggleCategory=id=>{document.querySelectorAll('.category-content').forEach(x=>{if(x.id!==id)x.classList.remove('open')});document.getElementById(id)?.classList.toggle('open')};
window.qty=(id,v)=>{cart[id]=Math.max(0,(cart[id]||0)+v);render();};
function render(){let html='',groups={},totalAmt=0,sum='';products.forEach(p=>(groups[p.category||'Other']??=[]).push(p));let first=true;for(const c in groups){const catId=c.replace(/\s+/g,'-').toLowerCase();html+=`<div class='card'><div class='category-header' onclick="toggleCategory('${catId}')"><span>${c}</span><span>(${groups[c].length})</span></div><div id='${catId}' class='category-content ${first?'open':''}'>`;first=false;groups[c].forEach(p=>{const q=cart[p.id]||0;html+=`<div class='item'><div>${p.image?`<img class='img' src='${p.image}'>`:''}</div><div style='flex:1;padding-left:10px'><b>${p.name}</b><br>${p.description||''}<br>₱${p.price||0}<br>${(p.qty||0)<=0?'<span class="out">❌ OUT OF STOCK</span>':''}</div><div class='qty-controls'>${(p.qty||0)<=0?'':`<button class='qty-btn minus-btn' onclick="qty('${p.id}',-1)">-</button><span>${q}</span><button class='qty-btn plus-btn' onclick="qty('${p.id}',1)">+</button>`}</div></div>`;if(q){totalAmt+=q*(p.price||0);sum+=`${p.name} x${q}\n`;}});html+='</div></div>';}menu.innerHTML=html;summary.innerText=sum||'No items selected';total.innerText=totalAmt;}
async function nextOrder(){const ref=doc(db,'counters','orders');let num=0;await runTransaction(db,async tx=>{const s=await tx.get(ref);num=(s.data()?.lastOrderNumber||0)+1;tx.update(ref,{lastOrderNumber:num});});return 'CK-'+String(num).padStart(4,'0');}
window.placeOrder=async()=>{const name=customerName.value.trim();if(!name)return alert('Enter name');const totalAmt=Number(total.innerText);if(totalAmt<=0)return alert('Select items');const orderNo=await nextOrder();await setDoc(doc(db,'orders',orderNo),{orderNumber:orderNo,customerName:name,status:'PENDING',notes:notes.value,total:totalAmt,createdAt:new Date().toISOString()});const trackUrl=`https://courtsidekitchen.github.io/courtside-kitchen-order/track.html?order=${orderNo}`;window.open(trackUrl,'_blank');const txt=`Order Number: ${orderNo}\nTrack Order: ${trackUrl}\nNotes:${notes.value}\nPlease attach payment screenshot.`;successBox.style.display='block';successBox.innerHTML=`<h3>✅ Order Created</h3><p><b>${orderNo}</b></p><a href='${trackUrl}' target='_blank'><button class='btn'>🔎 TRACK MY ORDER</button></a><br><br><a href='https://wa.me/639178512376?text=${encodeURIComponent(txt)}' target='_blank'><button class='btn'>📱 OPEN WHATSAPP & SEND PAYMENT</button></a>`;};
onSnapshot(collection(db,'products'),s=>{products=[];s.forEach(d=>products.push({id:d.id,...d.data()}));render();});
</script></body></html>

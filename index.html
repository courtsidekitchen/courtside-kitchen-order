<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Courtside Kitchen RC2</title>
<style>
body{font-family:Arial;background:#ececec;margin:0}.container{max-width:1100px;margin:auto;padding:12px}.card{background:#fff;padding:14px;border-radius:14px;margin-bottom:12px}.category{background:#163a70;color:#fff;padding:12px;border-radius:10px;display:flex;justify-content:space-between;cursor:pointer}.content{display:none}.content.open{display:block}.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}.img{width:80px;height:80px;object-fit:cover;border-radius:8px}.qtybtn{width:40px;height:40px;border:none;border-radius:8px;color:#fff}.plus{background:#28a745}.minus{background:#dc3545}.btn{width:100%;padding:16px;background:#163a70;color:#fff;border:none;border-radius:10px;font-size:18px}.cart{position:sticky;bottom:0;background:#fff;padding:12px;border-top:3px solid #163a70}
</style></head><body>
<div class='container'><div id='menu'></div>
<div class='card'>
<input id='customerName' placeholder='Name' style='width:100%;padding:10px'><br><br>
<textarea id='notes' placeholder='Special requests' style='width:100%;height:70px'></textarea><br><br>
<select id='discount' onchange='calc()' style='width:100%;padding:10px'>
<option value='0'>No Discount</option><option value='20'>Senior Citizen (20%)</option><option value='20'>PWD (20%)</option></select>
<br><br>
<select id='paymentMethod' onchange='updatePaymentImage()' style='width:100%;padding:10px'>
<option value='GCash'>GCash</option><option value='BPI'>BPI</option></select>
<br><br>
<img id='paymentImage' src='GCASH.jpg' style='max-width:250px;width:100%;border-radius:12px'>
<p>Attach payment screenshot and valid ID if claiming discount.</p>
</div><div id='success'></div></div>
<div class='cart'><div id='summary'>No items selected</div><div>Subtotal ₱<span id='sub'>0</span></div><div>Boba ₱<span id='boba'>0</span></div><div>Discount ₱<span id='disc'>0</span></div><h2>Total ₱<span id='total'>0</span></h2><button id="placeOrderBtn"
class='btn'
onclick='placeOrder()'>
🍽️ PLACE ORDER
</button>
<script type='module'>
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,collection,onSnapshot,doc,runTransaction,setDoc,updateDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyDRCXXhgQrMNan2lK-5WN1f5fcXBdzHj2I',authDomain:'courtside-kitchen.firebaseapp.com',projectId:'courtside-kitchen'});const db=getFirestore(app);
let products=[],cart={},bobaMap={},openCats=new Set();
window.updatePaymentImage=()=>{document.getElementById('paymentImage').src=document.getElementById('paymentMethod').value==='BPI'?'BPI.jpg':'GCASH.jpg'};
window.toggleCat=id=>{openCats.has(id)?openCats.delete(id):openCats.add(id);document.getElementById(id)?.classList.toggle('open');};
window.q=(id,n)=>{cart[id]=Math.max(0,(cart[id]||0)+n);calc();render();};
window.tb=id=>{bobaMap[id]=!bobaMap[id];calc();render();};
function buildItems(){const items=[];products.forEach(p=>{const q=cart[p.id]||0;if(q)items.push({name:p.name,qty:q,price:p.price||0,boba:!!bobaMap[p.id]})});return items;}
function calc(){let s=0,b=0,t='';products.forEach(p=>{let q=cart[p.id]||0;if(q){s+=q*(p.price||0);if(bobaMap[p.id])b+=q*5;t+=`${p.name} x${q}${bobaMap[p.id]?' + Boba':''}\n`;}});let d=(s+b)*(Number(discount.value)/100);sub.textContent=s;boba.textContent=b;disc.textContent=Math.round(d);total.textContent=Math.round(s+b-d);summary.innerText=t||'No items selected';}
function render(){
 
let g={},h='';
 
products.forEach(
p => (g[p.category || 'Other'] ??= []).push(p)
);
 
const categoryOrder = [
'Fruit Shakes',
'Fruit Sodas',
'Milk Tea',
'Power Plays',
'Quick Points'
];
 
const orderedCategories = [
...categoryOrder.filter(c => g[c]),
...Object.keys(g).filter(
c => !categoryOrder.includes(c)
)
];
 
for(const c of orderedCategories){
 
let id =
c.toLowerCase()
.replace(/[^a-z0-9]+/g,'-');
 
h+=`<div class='card'><div class='category' onclick="toggleCat('${id}')"><span>${c}</span><span>${g[c].length}</span></div><div id='${id}' class='content ${openCats.has(id)?'open':''}'>`;g[c].forEach(p=>{let milk=(p.category||'').toLowerCase().includes('milk');h+=`<div class='item'><div>${p.image?`<img class='img' src='${p.image}'>`:''}</div><div style='flex:1;padding-left:10px'><b>${p.name}</b><br>${p.description||''}<br>₱${p.price||0}${milk?`<br><label><input type='checkbox' ${bobaMap[p.id]?'checked':''} onchange="tb('${p.id}')"> Add Boba (+₱5)</label>`:''}</div><div><button class='qtybtn minus' onclick="q('${p.id}',-1)">-</button>${cart[p.id]||0}<button class='qtybtn plus' onclick="q('${p.id}',1)">+</button></div></div>`});h+='</div></div>';}menu.innerHTML=h;}
async function nextOrder(){const ref=doc(db,'counters','orders');let n=0;await runTransaction(db,async tx=>{const s=await tx.get(ref);n=(s.data()?.lastOrderNumber||0)+1;tx.update(ref,{lastOrderNumber:n});});return 'CK-'+String(n).padStart(4,'0');}
window.placeOrder=async()=>{
 
document.getElementById('placeOrderBtn').style.display='none';
 
if(!customerName.value)
return alert('Enter name');if(!customerName.value)return alert('Enter name');const items=buildItems();const orderNo=await nextOrder();const track=`track_rc1.html?order=${orderNo}`;const order={orderNumber:orderNo,paymentMethod:paymentMethod.value,customerName:customerName.value,status:'PENDING',notes:notes.value,items,discountType:discount.options[discount.selectedIndex].text,discountAmount:Number(disc.textContent),subtotal:Number(sub.textContent),bobaTotal:Number(boba.textContent),total:Number(total.textContent),createdAt:new Date().toISOString()};await setDoc(doc(db,'orders',orderNo),order);const wa=`Order Number:${orderNo}\nPayment Method:${order.paymentMethod}\nItems:\n${summary.innerText}\nSubtotal: ₱${sub.textContent}\nBoba: ₱${boba.textContent}\nDiscount:${order.discountType}\nTotal: ₱${order.total}\nNotes:${notes.value}`;const whatsappUrl =
`https://wa.me/639178512376?text=${encodeURIComponent(wa)}`;
 
window.location.href = whatsappUrl;success.innerHTML=`<div class='card'><h3>✅ ${orderNo}</h3><p>Status:<span id='orderStatus'>PENDING</span></p><p>Cancel window:<span id='timer'>30</span>s</p><button id='cancelBtn' onclick="cancelOrder('${orderNo}')">Cancel Order</button><div id='msg'></div><br><a href='${track}'><button class='btn'>🔎 TRACK MY ORDER</button></a><br><br></div>`;let t=30;let i=setInterval(async()=>{t--;const e=document.getElementById('timer');if(e)e.textContent=t;if(t<=0){clearInterval(i);await updateDoc(doc(db,'orders',orderNo),{status:'ORDER_RECEIVED'});document.getElementById('orderStatus').textContent='ORDER_RECEIVED';document.getElementById('cancelBtn')?.remove();document.getElementById('msg').innerHTML='✅ Order Sent To Kitchen';}},1000)};
window.cancelOrder=async(id)=>{await updateDoc(doc(db,'orders',id),{status:'CANCELLED',cancelledBy:'CUSTOMER'});alert('Cancelled');};
onSnapshot(collection(db,'products'),s=>{products=[];s.forEach(d=>products.push({id:d.id,...d.data()}));render();calc();});
</script></body></html>

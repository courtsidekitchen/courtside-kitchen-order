<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Courtside Kitchen Ordering</title><style>body{font-family:Arial;margin:0;background:#f4f6f9}.logo-container{text-align:center;padding:20px 15px 10px}.logo{max-width:350px;width:100%;height:auto}.container{max-width:900px;margin:auto;padding:12px}.card{background:#fff;padding:12px;border-radius:12px;margin-bottom:12px}.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0}.cart{position:sticky;bottom:0;background:#fff;padding:12px;border-top:4px solid #163a70}.subcategory{color:#163a70;font-weight:bold;margin-top:10px}.hidden{display:none}.qr{max-width:220px;width:100%}.order{width:100%;padding:12px;background:#163a70;color:#fff;border:none;border-radius:8px}small{color:#666}</style></head><body><div class='logo-container'><img src='logo.png' class='logo' alt='Courtside Kitchen'></div><div class='container'><div id='menu'></div><div class='card'><input id='name' placeholder='Name' style='width:100%;padding:8px'><br><select id='payment' onchange='payChange()' style='width:100%;padding:8px'><option>GCash</option><option>BPI</option></select><div id='g'><img class='qr' src='GCASH.jpg'><p><b>GCash</b><br>PA****K NI**O L.<br>09178512376</p></div><div id='b' class='hidden'><img class='qr' src='BPI.jpg'><p><b>BPI</b><br>PA****K NI**O LA***O.<br>0846454643</p></div><div style='background:#fff8e1;padding:10px;margin-top:10px'>📸 After clicking PLACE ORDER, Messenger will open.<br><br>Please send your payment confirmation screenshot as your next message in Messenger.<br><br><b style='color:red'>⚠️ Only confirmed paid orders will be processed.</b></div></div></div><div class='cart'><div id='summary'>No items selected</div><h2>Total ₱<span id='total'>0</span></h2><button class='order' onclick='placeOrder()'>📋 COPY ORDER & OPEN MESSENGER</button></div><script>const menu={'Fruit Shakes':[['Mango Smash','Mango Shake',150],['Melon Match Point','Melon Shake',150],['Strawberry Rally','Strawberry Yoghurt Shake',150],['Watermelon Winner','Watermelon Shake',150],['Banana Serve','Banana Shake',150]],'Fruit Sodas':[['Strawberry Serve Fizz','Strawberry Fruit Soda',100],['Peach Drop Shot','Peach Fruit Soda',100]],'Milk Tea':[['Sweet Spot Okinawa','Okinawa Milk Tea',95,true],['Grand Slam Choco','Chocolate Milk Tea',95,true],['Baseline Matcha','Matcha Milk Tea',95,true],['Nutty Dink Delight','Nutella Milk Tea',95,true]],'Quick Points':[['Paddle Popper Combo','Chicken Poppers & Fries',180],['Courtside Cheese Steak Sandwich','Philly Cheese Steak Sandwich',270],['The Third Shot Sausage','Hungarian Sausage Sandwich',150],['Hungarian Slice','Sliced Hungarian Sausage',100],['Sideout Sticks','Cheese Sticks',120],['Golden Dink Fries','Cheesy French Fries',100]],'Power Plays':[['Tapa Topspin Bowl','Tapa Rice Bowl',220],['Sweet Serve Tocino','Tocino Rice Bowl',200],['Spam Smash Bowl','Teriyaki Spam Rice Bowl',200],['Slice Serve Sisig','Sisig Rice Bowl',200],['Hungarian Heavy Hit','Hungarian Sausage Rice Bowl',180],['Courtside Cheese Steak Rice Bowl','Philly Cheese Steak Rice Bowl',270]]};let cart={},boba={};function chg(n,v){cart[n]=Math.max(0,(cart[n]||0)+v);render()}function payChange(){g.classList.toggle('hidden',payment.value!=='GCash');b.classList.toggle('hidden',payment.value!=='BPI')}function render(){let h='',t=0,s='';for(let c in menu){h+=`<div class='card'><div class='subcategory'>${c}</div>`;menu[c].forEach(i=>{let q=cart[i[0]]||0;let bb=boba[i[0]]||false;let p=i[2]+(bb?5:0);h+=`<div class='item'><div><b>${i[0]}</b><br><small>${i[1]}</small><br>₱${i[2]}${i[3]?`<br><label><input type='checkbox' ${bb?'checked':''} onchange="boba['${i[0]}']=this.checked;render()"> Add Boba (+₱5)</label>`:''}</div><div><button onclick="chg('${i[0]}',-1)">-</button>${q}<button onclick="chg('${i[0]}',1)">+</button></div></div>`;if(q){t+=q*p;s+=i[0]+(bb?' + Boba':'')+' x'+q+'\n';}});h+='</div>'}menuDiv.innerHTML=h;summary.innerText=s||'No items selected';total.innerText=t}function placeOrder(){const customerName=document.getElementById('name').value.trim();const totalAmount=parseFloat(total.innerText)||0;if(customerName===''){alert('Please enter your name.');return;}if(totalAmount<=0){alert('Please select at least one item before placing an order.');return;}const now=new Date();const timestamp=now.toLocaleString('en-PH',{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});const orderNumber='CK-'+Date.now().toString().slice(-8);const msg=`COURTSIDE KITCHEN ORDER\n\nOrder Number: ${orderNumber}\nDate & Time: ${timestamp}\n\nName: ${customerName}\n\nItems:\n${summary.innerText}\nTotal: ₱${total.innerText}\n\nPayment Method: ${payment.value}\n\nPayment screenshot will be sent separately.`;navigator.clipboard.writeText(msg).catch(()=>{});const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);alert('✅ Order copied to clipboard. Order Number: '+orderNumber);if(mobile){window.location.href='fb-messenger://user-thread/1282294331624336';setTimeout(()=>window.open('https://m.me/1282294331624336','_blank'),1500);}else{window.open('https://m.me/1282294331624336','_blank');}}const menuDiv=document.getElementById('menu');payChange();render();</script></body></html>

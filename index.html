<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Courtside Kitchen Menu</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#ececec;margin:0;padding:12px;padding-bottom:40px;color:#333}
.container{max-width:600px;margin:0 auto}

/* Header */
.header{text-align:center;padding:10px 0 20px 0}
.header h1{margin:0;color:#0066cc;font-size:24px}

/* Category Headers */
.category-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,0.05)}
.category-header{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:18px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #f0f0f0}

/* Item Row Layout (Right Aligned Quantity Controls) */
.item-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0f0}
.item-row:last-child{border-bottom:none}

/* Item Details */
.item-details{display:flex;flex-direction:column;gap:4px;flex:1;padding-right:12px}
.item-name{font-weight:bold;font-size:16px;color:#222}
.item-desc{font-size:12px;color:#777}
.item-price{color:#0066cc;font-weight:bold;font-size:15px}
.item-opt{font-size:12px;color:#555;display:flex;align-items:center;gap:4px;margin-top:2px;cursor:pointer}

/* Item Controls */
.item-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn-qty{width:32px;height:32px;background:#0066cc;color:#fff;border:none;border-radius:6px;font-size:18px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-qty:active{background:#004c99}
.qty-display{width:36px;height:32px;text-align:center;border:1px solid #ccc;border-radius:6px;font-size:14px;font-weight:bold;line-height:30px;background:#fff}

/* Inline Summary Card (Matching your Screenshot) */
.checkout-card{background:#fff;border-radius:12px;padding:20px;margin-top:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08);display:none}
.summary-items{font-size:15px;line-height:1.6;margin-bottom:10px}
.summary-line{font-size:15px;margin:4px 0;color:#333}
.grand-total{font-size:22px;font-weight:bold;margin:16px 0;color:#000}

.customer-input{width:100%;padding:12px;margin:10px 0 16px 0;border:1px solid #ccc;border-radius:8px;font-size:15px}

.btn-place-order{
  width:100%;
  background:#004080;
  color:#fff;
  border:none;
  padding:14px;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.btn-place-order:hover{background:#003366}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Courtside Kitchen</h1>
  </div>

  <div id="menuContainer">Loading menu...</div>

  <!-- Inline Checkout Summary Box -->
  <div id="checkoutBox" class="checkout-card">
    <div id="summaryItems" class="summary-items"></div>
    
    <div class="summary-line">Subtotal ₱<span id="subtotalVal">0</span></div>
    <div class="summary-line">Boba ₱<span id="bobaVal">0</span></div>
    <div class="summary-line">Discount ₱0</div>
    
    <div class="grand-total">Total ₱<span id="totalVal">0</span></div>

    <input id="customerName" class="customer-input" type="text" placeholder="Enter Customer Name">

    <button id="placeOrderBtn" class="btn-place-order" onclick="submitOrder()">
      🍽️ PLACE ORDER
    </button>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, onSnapshot, addDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyDRCXXhgQrMNan2lK-5WN1f5fcXBdzHj2I',
  authDomain: 'courtside-kitchen.firebaseapp.com',
  projectId: 'courtside-kitchen',
  storageBucket: 'courtside-kitchen.appspot.com',
  messagingSenderId: '1062967764463',
  appId: '1:1062967764463:web:0b6dbbfec0904d0f0c05a1'
});

const db = getFirestore(app);

let products = [];
let cart = {};

onSnapshot(collection(db, 'products'), (snap) => {
  products = [];
  snap.forEach(doc => {
    products.push({ id: doc.id, ...doc.data() });
  });
  renderMenu();
});

function renderMenu() {
  const container = document.getElementById('menuContainer');
  if (products.length === 0) {
    container.innerHTML = '<p style="text-align:center;">No products available.</p>';
    return;
  }

  const categories = {};
  products.forEach(p => {
    const cat = p.category || 'General';
    if (!categories[cat]) categories[cat] = [];
    categories[cat].push(p);
  });

  let html = '';
  for (const [catName, items] of Object.entries(categories)) {
    html += `
      <div class="category-card">
        <div class="category-header">
          <span>${catName}</span>
          <span style="font-size:14px;color:#666;">${items.length}</span>
        </div>
    `;

    items.forEach(item => {
      const currentQty = cart[item.id] ? cart[item.id].qty : 0;
      const hasBoba = cart[item.id] ? cart[item.id].boba : false;
      const isMilkTea = catName.toLowerCase().includes('tea') || (item.name && item.name.toLowerCase().includes('matcha'));

      html += `
        <div class="item-row">
          <div class="item-details">
            <div class="item-name">${item.name}</div>
            ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
            <div class="item-price">₱${item.price || 0}</div>
            ${isMilkTea ? `
              <label class="item-opt">
                <input type="checkbox" ${hasBoba ? 'checked' : ''} onchange="window.toggleBoba('${item.id}', this.checked)"> Boba +₱5
              </label>
            ` : ''}
          </div>
          <div class="item-controls">
            <button class="btn-qty" onclick="window.updateQty('${item.id}', -1)">-</button>
            <div class="qty-display">${currentQty}</div>
            <button class="btn-qty" onclick="window.updateQty('${item.id}', 1)">+</button>
          </div>
        </div>
      `;
    });

    html += `</div>`;
  }

  container.innerHTML = html;
  updateSummaryCard();
}

window.updateQty = (id, change) => {
  const prod = products.find(p => p.id === id);
  if (!prod) return;

  if (!cart[id]) {
    cart[id] = { 
      id: prod.id, 
      name: prod.name, 
      price: Number(prod.price || 0), 
      qty: 0, 
      boba: false,
      category: prod.category || ''
    };
  }

  cart[id].qty += change;

  if (cart[id].qty <= 0) {
    delete cart[id];
  }

  renderMenu();
};

window.toggleBoba = (id, isChecked) => {
  if (cart[id]) {
    cart[id].boba = isChecked;
  } else {
    const prod = products.find(p => p.id === id);
    if (prod) {
      cart[id] = { 
        id: prod.id, 
        name: prod.name, 
        price: Number(prod.price || 0), 
        qty: 1, 
        boba: isChecked,
        category: prod.category || ''
      };
    }
  }
  renderMenu();
};

function updateSummaryCard() {
  const checkoutBox = document.getElementById('checkoutBox');
  const cartItems = Object.values(cart);

  if (cartItems.length === 0) {
    checkoutBox.style.display = 'none';
    return;
  }

  let itemsHtml = '';
  let baseSubtotal = 0;
  let totalBoba = 0;

  cartItems.forEach(item => {
    baseSubtotal += item.price * item.qty;
    
    // Strict Boba Rule: Boba +₱5 is only added if boba is checked AND item is Milk Tea/Matcha
    const isMilkTea = item.category.toLowerCase().includes('tea') || item.name.toLowerCase().includes('matcha');
    if (item.boba && isMilkTea) {
      totalBoba += 5 * item.qty;
    }

    itemsHtml += `<div>${item.name} x${item.qty}${item.boba && isMilkTea ? ' + Boba' : ''}</div>`;
  });

  const grandTotal = baseSubtotal + totalBoba;

  document.getElementById('summaryItems').innerHTML = itemsHtml;
  document.getElementById('subtotalVal').textContent = baseSubtotal;
  document.getElementById('bobaVal').textContent = totalBoba;
  document.getElementById('totalVal').textContent = grandTotal;

  checkoutBox.style.display = 'block';
}

window.submitOrder = async () => {
  const nameInput = document.getElementById('customerName').value.trim();
  if (!nameInput) {
    alert('Please enter a customer name.');
    return;
  }

  const btn = document.getElementById('placeOrderBtn');
  btn.disabled = true;
  btn.textContent = 'PLACING ORDER...';

  const orderItems = Object.values(cart).map(i => ({
    id: i.id,
    name: i.name,
    qty: i.qty,
    price: i.price,
    boba: i.boba || false
  }));

  let subtotal = 0;
  let bobaCost = 0;
  orderItems.forEach(i => {
    subtotal += i.price * i.qty;
    if(i.boba) bobaCost += (5 * i.qty);
  });

  try {
    await addDoc(collection(db, 'orders'), {
      customerName: nameInput,
      items: orderItems,
      subtotal: subtotal,
      bobaFee: bobaCost,
      total: subtotal + bobaCost,
      status: 'PENDING',
      createdAt: new Date().toISOString(),
      orderNumber: 'ORD-' + Math.floor(1000 + Math.random() * 9000)
    });

    alert('Order placed successfully!');
    cart = {};
    document.getElementById('customerName').value = '';
    renderMenu();
  } catch (err) {
    alert('Error placing order: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🍽️ PLACE ORDER';
  }
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Courtside Kitchen - Online Ordering & Live Tracker</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f0f4f8;color:#1e293b}

/* App Header */
.app-header{display:flex;justify-content:space-between;align-items:center;background:#ffffff;padding:8px 16px;border-bottom:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(15,43,72,0.04);position:sticky;top:0;z-index:100}
.brand-logo-header{height:45px;max-width:140px;object-fit:contain}
.cart-badge-btn{background:#0f2b48;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px}

/* Category Filter Bar - Single Page Fit (No Scroll) */
.category-filter{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  padding:8px 10px;
  background:#ffffff;
  border-bottom:1px solid #e2e8f0;
  position:sticky;
  top:61px;
  z-index:90;
}
.category-filter button{
  flex:1 1 calc(25% - 5px);
  min-width:75px;
  padding:6px 6px;
  background:#e2e8f0;
  border:none;
  border-radius:14px;
  font-size:11.5px;
  font-weight:bold;
  cursor:pointer;
  text-align:center;
  color:#475569;
  transition:all 0.15s;
}
.category-filter button.active{background:#0f2b48;color:#ffffff}

/* Container & Grids */
.container{max-width:800px;margin:0 auto;padding:12px 14px 80px 14px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.menu-item-card{background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;padding:12px;text-align:center;box-shadow:0 1px 3px rgba(15,43,72,0.04);display:flex;flex-direction:column;justify-content:space-between}
.menu-item-name{font-weight:bold;font-size:13px;margin-bottom:4px;color:#0f2b48}
.menu-item-price{color:#0f2b48;font-weight:bold;font-size:13px;margin-bottom:6px}

/* Milk Tea Boba (+₱5) Toggle Pill on Product Card */
.boba-toggle-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  background:#f8fafc;
  border:1px solid #cbd5e1;
  border-radius:14px;
  padding:4px 8px;
  font-size:11px;
  font-weight:bold;
  color:#475569;
  cursor:pointer;
  margin-bottom:8px;
  user-select:none;
  transition:all 0.15s;
}
.boba-toggle-btn.active{background:#0f2b48;color:#ffffff;border-color:#0f2b48}

.btn-add{background:#0f2b48;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer;width:100%}

/* Cart Modal Drawer */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,43,72,0.5);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.cart-drawer{background:#ffffff;width:100%;max-width:500px;max-height:88vh;border-radius:16px 16px 0 0;padding:18px;display:flex;flex-direction:column;box-shadow:0 -4px 20px rgba(0,0,0,0.15)}
.cart-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0;padding-bottom:10px;margin-bottom:10px}
.cart-items-box{flex:1;overflow-y:auto;margin-bottom:10px}
.cart-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9}
.qty-ctrl{display:flex;gap:6px;align-items:center}
.qty-ctrl button{padding:3px 9px;font-size:12px;border:none;background:#0f2b48;color:#fff;border-radius:4px;cursor:pointer;font-weight:bold}
.summary-line{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:#475569}
.total-line{font-size:18px;font-weight:bold;color:#0f2b48;border-top:2px solid #0f2b48;margin-top:6px;padding-top:6px}
input, textarea, select{width:100%;padding:9px 10px;margin:4px 0;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;background:#f8fafc}

/* Payment & WhatsApp Confirmation Instructions */
.payment-info-box{background:#f8fafc;border:1px dashed #0f2b48;border-radius:8px;padding:10px;margin:8px 0;font-size:12.5px;color:#0f2b48;display:block}

/* Live Tracker View */
#trackerScreen{display:none;max-width:500px;margin:20px auto;background:#ffffff;border-radius:14px;box-shadow:0 4px 20px rgba(15,43,72,0.08);border:1px solid #e2e8f0;padding:20px;text-align:center}
.order-num-badge{background:#0f2b48;color:#ffffff;padding:6px 14px;border-radius:20px;display:inline-block;font-weight:bold;font-size:16px;margin-bottom:10px;letter-spacing:1px}
.pager-badge{background:#d97706;color:#ffffff;padding:4px 10px;border-radius:14px;font-size:13px;font-weight:bold;margin-bottom:12px;display:inline-block}

.status-card{background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;padding:16px;margin:12px 0;transition:all 0.3s}
.status-title{font-size:18px;font-weight:900;margin:0;color:#0f2b48}
.status-desc{font-size:13px;color:#64748b;margin:6px 0 0 0}
.status-ready{background:#fffbeb !important;border-color:#f59e0b !important;animation:pulseReady 1.5s infinite}
.status-ready .status-title{color:#b45309 !important;font-size:20px !important}
.status-completed{background:#f0fdf4 !important;border-color:#22c55e !important}
.status-completed .status-title{color:#15803d !important}

@keyframes pulseReady{
  0%{transform:scale(1);box-shadow:0 0 0 0 rgba(245,158,11,0.4)}
  70%{transform:scale(1.02);box-shadow:0 0 0 12px rgba(245,158,11,0)}
  100%{transform:scale(1);box-shadow:0 0 0 0 rgba(245,158,11,0)}
}

/* Timeline */
.timeline{display:flex;justify-content:space-between;position:relative;margin:24px 0 16px 0}
.timeline::before{content:"";position:absolute;top:14px;left:10%;right:10%;height:3px;background:#e2e8f0;z-index:1}
.timeline-step{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:25%}
.step-circle{width:30px;height:30px;border-radius:50%;background:#cbd5e1;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold}
.step-circle.active{background:#0f2b48}
.step-circle.ready{background:#f59e0b}
.step-circle.done{background:#22c55e}
.step-label{font-size:10px;font-weight:bold;margin-top:6px;color:#64748b;text-align:center}

.items-list{background:#f8fafc;border-radius:10px;padding:12px;text-align:left;font-size:13px;border:1px solid #e2e8f0;margin-top:14px}
.item-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f1f5f9}
</style>
</head>
<body>

<div class="app-header">
  <img src="logo.png" alt="Courtside Kitchen" class="brand-logo-header">
  <button id="cartBtn" class="cart-badge-btn" onclick="openCartModal()">
    🛒 View Cart (<span id="cartCount">0</span>)
  </button>
</div>

<!-- Category Filters (1-Page Wrap Fit) -->
<div id="categoryFilterBar" class="category-filter"></div>

<!-- Main Menu Section -->
<div id="menuContainer" class="container">
  <div id="menuCatalog" class="menu-grid"></div>
</div>

<!-- Customer Cart Modal Drawer -->
<div id="cartModal" class="modal-overlay">
  <div class="cart-drawer">
    <div class="cart-header">
      <h3 style="margin:0;color:#0f2b48;">🛒 Your Order Cart</h3>
      <button onclick="closeCartModal()" style="background:none;border:none;font-size:18px;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <div id="cartList" class="cart-items-box">
      <div style="text-align:center;color:#94a3b8;padding:20px;">Cart is empty.</div>
    </div>

    <div>
      <input id="custName" placeholder="Your Name">
      <textarea id="custNotes" placeholder="Special cooking / prep requests..." style="height:38px;"></textarea>

      <!-- Upfront Payment Method Selection Only -->
      <label style="font-size:11.5px;font-weight:bold;color:#475569;">Payment Method (Upfront Payment Required):</label>
      <select id="custPaymentMethod" onchange="handlePaymentMethodChange()">
        <option value="GCash">GCash (E-Wallet)</option>
        <option value="BPI">BPI (Online Transfer)</option>
      </select>

      <div id="paymentInfoBox" class="payment-info-box"></div>

      <div class="summary-line"><span>Subtotal:</span><span>₱<span id="cartSub">0</span></span></div>
      <div class="summary-line total-line"><span>Total:</span><span>₱<span id="cartTot">0</span></span></div>

      <button id="placeOrderBtn" onclick="submitCustomerOrder()" style="width:100%;background:#0f2b48;color:#fff;border:none;padding:12px;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;">
        🚀 Place Order
      </button>
    </div>
  </div>
</div>

<!-- Live Order Tracker Screen -->
<div id="trackerScreen">
  <img src="logo.png" alt="Courtside Kitchen" class="brand-logo-header" style="height:60px;margin-bottom:8px;"><br>
  <div id="trackerOrderBadge" class="order-num-badge">CK-0000</div><br>
  <div id="trackerPagerBadge" class="pager-badge" style="display:none;">📟 CUSTOMER # 0</div>

  <div id="statusBox" class="status-card">
    <h2 id="statusTitle" class="status-title">Order Received</h2>
    <p id="statusDesc" class="status-desc">Your order has been sent to the kitchen.</p>
  </div>

  <div class="timeline">
    <div class="timeline-step"><div id="step-rec" class="step-circle active">1</div><div class="step-label">Received</div></div>
    <div class="timeline-step"><div id="step-prep" class="step-circle">2</div><div class="step-label">Preparing</div></div>
    <div class="timeline-step"><div id="step-ready" class="step-circle">3</div><div class="step-label">Ready</div></div>
    <div class="timeline-step"><div id="step-done" class="step-circle">4</div><div class="step-label">Claimed</div></div>
  </div>

  <div class="items-list">
    <div style="font-weight:bold;margin-bottom:6px;color:#0f2b48;">Order Summary</div>
    <div id="trackerItemsContainer"></div>
    <div style="display:flex;justify-content:space-between;font-weight:bold;font-size:15px;color:#0f2b48;border-top:2px solid #e2e8f0;padding-top:6px;margin-top:6px;">
      <span>Total:</span>
      <span id="trackerTotal">₱0</span>
    </div>
  </div>

  <!-- WhatsApp Confirmation Re-send Button on Tracker -->
  <button id="sendWaConfirmBtn" onclick="openWhatsAppConfirmation()" style="width:100%;background:#25d366;color:#fff;border:none;padding:12px;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;">
    📲 Send Payment Confirmation via WhatsApp
  </button>

  <button onclick="startNewOrder()" style="background:#1e3a5f;color:#fff;border:none;padding:10px 16px;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:8px;width:100%;">
    ➕ Order More / New Order
  </button>
</div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore, collection, onSnapshot, doc, setDoc, runTransaction} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyDRCXXhgQrMNan2lK-5WN1f5fcXBdzHj2I',
  authDomain: 'courtside-kitchen.firebaseapp.com',
  projectId: 'courtside-kitchen',
  storageBucket: 'courtside-kitchen.appspot.com',
  messagingSenderId: '1062967764463',
  appId: '1:1062967764463:web:0b6dbbfec0904d0f0c05a1'
});
const db = getFirestore(app);

const STORE_WHATSAPP_NUMBER = '639171234567';

const ADDON_DEFS = {
  fries: { name: 'Plain fries', price: 50 },
  rice: { name: 'Extra Rice', price: 35 },
  egg: { name: 'Extra Egg', price: 20 },
  sauce: { name: 'Extra Sauce', price: 30 },
  boba: { name: 'Extra Boba', price: 10 }
};

const PREFERRED_CAT_ORDER = [
  'Fruit Shakes',
  'Fruit Sodas',
  'Milk Tea',
  'Quick Points',
  'Power Plays',
  'Add-ons'
];

let products = [];
let customerCart = {};
let milkTeaBobaSelection = {};
let selectedCategory = 'ALL';
let activeOrderId = null;
let currentWaUrl = '';
let trackerUnsubscribe = null;
let alarmInterval = null;
let currentAlarmAudio = null;

const urlParams = new URLSearchParams(window.location.search);
const orderParam = urlParams.get('order') || urlParams.get('id');
const storedOrderId = localStorage.getItem('ck_active_order_id');

window.addEventListener('DOMContentLoaded', () => {
  if (orderParam) {
    showLiveTracker(orderParam);
  } else if (storedOrderId) {
    showLiveTracker(storedOrderId);
  } else {
    initCatalogListener();
  }
});

function initCatalogListener() {
  onSnapshot(collection(db, 'products'), snap => {
    products = [];
    snap.forEach(d => products.push({ id: d.id, ...d.data() }));
    renderCategoryPills();
    renderCatalog();
  });
}

function normalizeCategoryName(rawCat = '') {
  const lower = rawCat.trim().toLowerCase();
  if (lower.includes('shake')) return 'Fruit Shakes';
  if (lower.includes('soda')) return 'Fruit Sodas';
  if (lower.includes('tea')) return 'Milk Tea';
  if (lower.includes('point')) return 'Quick Points';
  if (lower.includes('power') || lower.includes('play')) return 'Power Plays';
  return rawCat.trim() || 'Other';
}

function getCategoryRank(catName) {
  const norm = normalizeCategoryName(catName);
  const idx = PREFERRED_CAT_ORDER.indexOf(norm);
  return idx === -1 ? 99 : idx;
}

function renderCategoryPills() {
  const presentCats = new Set(products.map(p => normalizeCategoryName(p.category)));
  const sortedCats = PREFERRED_CAT_ORDER.filter(c => c === 'Add-ons' || presentCats.has(c));
  presentCats.forEach(c => { if (!sortedCats.includes(c)) sortedCats.push(c); });

  const allTabs = ['ALL', ...sortedCats];
  const container = document.getElementById('categoryFilterBar');
  if (!container) return;
  container.innerHTML = allTabs.map(c => `
    <button class="${c === selectedCategory ? 'active' : ''}" onclick="selectCategory('${c}')">${c}</button>
  `).join('');
}

window.selectCategory = (c) => {
  selectedCategory = c;
  renderCategoryPills();
  renderCatalog();
};

window.toggleMilkTeaBobaOnCard = (prodId) => {
  milkTeaBobaSelection[prodId] = !milkTeaBobaSelection[prodId];
  renderCatalog();
};

function renderCatalog() {
  const catalogEl = document.getElementById('menuCatalog');
  if (!catalogEl) return;
  let h = '';

  let filtered = products.filter(p => {
    if (selectedCategory !== 'ALL' && selectedCategory !== 'Add-ons') {
      return normalizeCategoryName(p.category) === selectedCategory;
    }
    return true;
  });

  filtered.sort((a, b) => {
    const rankA = getCategoryRank(a.category);
    const rankB = getCategoryRank(b.category);
    if (rankA !== rankB) return rankA - rankB;
    return (a.name || '').localeCompare(b.name || '');
  });

  if (selectedCategory !== 'Add-ons') {
    filtered.forEach(p => {
      const isOut = (p.qty || 0) <= 0;
      const isMilkTea = normalizeCategoryName(p.category) === 'Milk Tea';
      const hasBoba = !!milkTeaBobaSelection[p.id];
      const displayedPrice = (p.price || 0) + (isMilkTea && hasBoba ? 5 : 0);

      h += `
        <div class="menu-item-card" style="${isOut ? 'opacity:0.45;pointer-events:none;' : ''}">
          <div>
            ${p.image ? `<img src="${p.image}" style="max-width:100%;height:85px;object-fit:cover;border-radius:6px;margin-bottom:6px;">` : ''}
            <div class="menu-item-name">${p.name}${isMilkTea && hasBoba ? ' with Boba' : ''}</div>
            <div class="menu-item-price">₱${displayedPrice}</div>
            ${isMilkTea ? `
              <div class="boba-toggle-btn ${hasBoba ? 'active' : ''}" onclick="toggleMilkTeaBobaOnCard('${p.id}')">
                ${hasBoba ? '✓ With Boba (+₱5)' : '+ Add Boba (+₱5)'}
              </div>
            ` : ''}
          </div>
          <button class="btn-add" onclick="addCustomizedToCart('${p.id}', ${isMilkTea && hasBoba})">${isOut ? 'Out of Stock' : '➕ Add to Cart'}</button>
        </div>
      `;
    });
  }

  if (selectedCategory === 'Add-ons' || selectedCategory === 'ALL') {
    Object.entries(ADDON_DEFS).forEach(([k, item]) => {
      h += `
        <div class="menu-item-card" style="border:1px dashed #0f2b48;background:#f8fafc;">
          <div>
            <div class="menu-item-name">${item.name}</div>
            <div class="menu-item-price">₱${item.price}</div>
            <small style="color:#0f2b48;font-weight:bold;">Side Add-on</small>
          </div>
          <button class="btn-add" style="margin-top:8px;" onclick="addStandaloneAddon('${k}')">➕ Add</button>
        </div>
      `;
    });
  }

  catalogEl.innerHTML = h;
}

window.addCustomizedToCart = (prodId, withBoba) => {
  const cartKey = withBoba ? `${prodId}__boba` : prodId;
  customerCart[cartKey] = (customerCart[cartKey] || 0) + 1;
  updateCartBadge();
  renderCartModal();
};

window.addStandaloneAddon = (k) => {
  const fakeId = `addon_${k}`;
  customerCart[fakeId] = (customerCart[fakeId] || 0) + 1;
  updateCartBadge();
  renderCartModal();
};

window.changeCartQty = (key, delta) => {
  customerCart[key] = Math.max(0, (customerCart[key] || 0) + delta);
  if (customerCart[key] === 0) {
    delete customerCart[key];
  }
  updateCartBadge();
  renderCartModal();
};

function updateCartBadge() {
  const totalItems = Object.values(customerCart).reduce((a, b) => a + b, 0);
  document.getElementById('cartCount').textContent = totalItems;
}

window.openCartModal = () => {
  renderCartModal();
  handlePaymentMethodChange();
  document.getElementById('cartModal').classList.add('active');
};

window.closeCartModal = () => {
  document.getElementById('cartModal').classList.remove('active');
};

window.handlePaymentMethodChange = () => {
  const method = document.getElementById('custPaymentMethod').value;
  const infoBox = document.getElementById('paymentInfoBox');

  if (method === 'GCash') {
    infoBox.style.display = 'block';
    infoBox.innerHTML = '📱 <b>GCash Payment:</b> Please attach or send your GCash payment confirmation screenshot via WhatsApp right after submitting.';
  } else if (method === 'BPI') {
    infoBox.style.display = 'block';
    infoBox.innerHTML = '🏦 <b>BPI Online:</b> Please transfer and send your BPI transfer confirmation screenshot via WhatsApp right after submitting.';
  } else {
    infoBox.style.display = 'none';
  }
};

function renderCartModal() {
  const list = document.getElementById('cartList');
  const entries = Object.entries(customerCart);
  let subtotal = 0;

  if (!entries.length) {
    list.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:20px;">Cart is empty.</div>';
    document.getElementById('cartSub').textContent = '0';
    document.getElementById('cartTot').textContent = '0';
    return;
  }

  let h = '';
  entries.forEach(([key, qty]) => {
    let itemName = '';
    let itemPrice = 0;

    if (key.startsWith('addon_')) {
      const addonKey = key.replace('addon_', '');
      const addon = ADDON_DEFS[addonKey];
      if (!addon) return;
      itemName = addon.name;
      itemPrice = addon.price;
    } else {
      const hasBoba = key.endsWith('__boba');
      const prodId = hasBoba ? key.replace('__boba', '') : key;
      const p = products.find(x => x.id === prodId);
      if (!p) return;
      itemName = hasBoba ? `${p.name} with Boba` : p.name;
      itemPrice = (p.price || 0) + (hasBoba ? 5 : 0);
    }

    const itemTotal = itemPrice * qty;
    subtotal += itemTotal;

    h += `
      <div class="cart-row">
        <div>
          <b style="font-size:13px;color:#0f2b48;">${itemName}</b>
          <div style="font-size:12px;color:#64748b;">₱${itemPrice} each</div>
        </div>
        <div class="qty-ctrl">
          <button onclick="changeCartQty('${key}', -1)">-</button>
          <span style="font-weight:bold;font-size:13px;min-width:18px;text-align:center;">${qty}</span>
          <button onclick="changeCartQty('${key}', 1)">+</button>
          <span style="min-width:50px;text-align:right;font-weight:bold;font-size:13px;color:#0f2b48;">₱${itemTotal}</span>
        </div>
      </div>
    `;
  });

  list.innerHTML = h;
  document.getElementById('cartSub').textContent = subtotal.toLocaleString();
  document.getElementById('cartTot').textContent = subtotal.toLocaleString();
}

async function getNextOrderNumber() {
  const ref = doc(db, 'counters', 'orders');
  let n = 0;
  await runTransaction(db, async tx => {
    const s = await tx.get(ref);
    n = (s.data()?.lastOrderNumber || 0) + 1;
    tx.update(ref, { lastOrderNumber: n });
  });
  return n;
}

window.submitCustomerOrder = async () => {
  const name = document.getElementById('custName').value.trim();
  const notes = document.getElementById('custNotes').value.trim();
  const paymentMethod = document.getElementById('custPaymentMethod').value;

  if (!name) return alert('Please enter your name.');
  if (!Object.keys(customerCart).length) return alert('Your cart is empty.');

  const items = [];
  let subtotal = 0;
  let waItemsText = '';

  Object.entries(customerCart).forEach(([key, qty]) => {
    if (key.startsWith('addon_')) {
      const addonKey = key.replace('addon_', '');
      const addon = ADDON_DEFS[addonKey];
      if (!addon) return;
      const lineCost = addon.price * qty;
      subtotal += lineCost;
      items.push({ name: addon.name, qty: qty, price: addon.price, addons: [] });
      waItemsText += `• ${qty}x ${addon.name} - ₱${lineCost}\n`;
      return;
    }

    const hasBoba = key.endsWith('__boba');
    const prodId = hasBoba ? key.replace('__boba', '') : key;
    const p = products.find(x => x.id === prodId);
    if (!p) return;

    const unitPrice = (p.price || 0) + (hasBoba ? 5 : 0);
    const lineCost = unitPrice * qty;
    subtotal += lineCost;
    
    const displayTitle = hasBoba ? `${p.name} with Boba` : p.name;
    items.push({ 
      name: displayTitle, 
      qty: qty, 
      price: unitPrice, 
      addons: hasBoba ? ['Boba (+₱5)'] : [] 
    });
    waItemsText += `• ${qty}x ${displayTitle} - ₱${lineCost}\n`;
  });

  const btn = document.getElementById('placeOrderBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting Order...';

  try {
    const n = await getNextOrderNumber();
    const formattedOrderNo = `CK-${String(n).padStart(4, '0')}`;
    const track = `track_rc1.html?order=${formattedOrderNo}`;

    const orderData = {
      orderNumber: formattedOrderNo,
      customerName: name,
      pagerNumber: 'NONE',
      notes: notes,
      items: items,
      paymentMethod: paymentMethod,
      subtotal: subtotal,
      total: subtotal,
      status: 'PENDING',
      createdAt: new Date().toISOString(),
      trackingLink: track
    };

    await setDoc(doc(db, 'orders', formattedOrderNo), orderData);

    localStorage.setItem('ck_active_order_id', formattedOrderNo);
    closeCartModal();
    customerCart = {};
    updateCartBadge();

    // Prepare WhatsApp Message & URL
    const waMessage = 
      `*🛒 COURTSIDE KITCHEN ORDER*\n` +
      `*Order #:* ${formattedOrderNo}\n` +
      `*Customer:* ${name}\n` +
      `*Payment:* ${paymentMethod}\n` +
      (notes ? `*Notes:* ${notes}\n` : '') +
      `--------------------------\n` +
      waItemsText +
      `--------------------------\n` +
      `*TOTAL: ₱${subtotal.toLocaleString()}*\n\n` +
      `📍 Track live status:\n${window.location.origin}/track_rc1.html?order=${formattedOrderNo}`;

    currentWaUrl = `https://wa.me/${STORE_WHATSAPP_NUMBER}?text=${encodeURIComponent(waMessage)}`;
    
    // Automatically launch WhatsApp and move directly to Live Tracker
    window.open(currentWaUrl, '_blank');
    showLiveTracker(formattedOrderNo);
  } catch (e) {
    alert('Error submitting order: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 Place Order';
  }
};

window.openWhatsAppConfirmation = () => {
  if (currentWaUrl) {
    window.open(currentWaUrl, '_blank');
  } else if (activeOrderId) {
    const waUrl = `https://wa.me/${STORE_WHATSAPP_NUMBER}?text=${encodeURIComponent(`Hello Courtside Kitchen, sending payment confirmation for order ${activeOrderId}`)}`;
    window.open(waUrl, '_blank');
  }
};

function playPickupAlarm() {
  try {
    if (currentAlarmAudio) {
      currentAlarmAudio.pause();
      currentAlarmAudio.currentTime = 0;
    }
    currentAlarmAudio = new Audio('sms_jackpot.mp3?t=' + Date.now());
    currentAlarmAudio.volume = 1.0;
    currentAlarmAudio.play().catch(() => {});
  } catch (e) {}
}

function showLiveTracker(orderId) {
  activeOrderId = orderId;
  document.getElementById('menuContainer').style.display = 'none';
  document.getElementById('categoryFilterBar').style.display = 'none';
  document.getElementById('cartBtn').style.display = 'none';
  document.getElementById('trackerScreen').style.display = 'block';

  document.getElementById('trackerOrderBadge').textContent = orderId;

  if (trackerUnsubscribe) trackerUnsubscribe();

  trackerUnsubscribe = onSnapshot(doc(db, 'orders', orderId), snap => {
    if (!snap.exists()) return;
    const data = snap.data();
    const rawStatus = (data.status || 'PENDING').toString().toUpperCase();

    const rawPager = (data.pagerNumber || '').trim();
    const pagerBadge = document.getElementById('trackerPagerBadge');
    if (rawPager && rawPager !== 'NONE') {
      pagerBadge.style.display = 'inline-block';
      pagerBadge.textContent = `📟 CUSTOMER # ${rawPager.replace(/[^0-9]/g, '') || rawPager}`;
    } else {
      pagerBadge.style.display = 'none';
    }

    let itemsHtml = '';
    let waItemsText = '';
    (data.items || []).forEach(i => {
      const name = typeof i === 'string' ? i : i.name;
      const qty = i.qty || 1;
      const price = i.price || 0;
      let addonText = (i.addons && i.addons.length && !name.includes('with Boba')) ? `<br><small style="color:#0f2b48;">+ ${i.addons.join(', ')}</small>` : '';
      itemsHtml += `<div class="item-row"><div><b>${name} x${qty}</b>${addonText}</div><div>₱${price * qty}</div></div>`;
      waItemsText += `• ${qty}x ${name} - ₱${price * qty}\n`;
    });
    document.getElementById('trackerItemsContainer').innerHTML = itemsHtml;
    document.getElementById('trackerTotal').textContent = `₱${data.total || 0}`;

    // Reconstruct WhatsApp URL if page is reloaded
    if (!currentWaUrl) {
      const waMessage = 
        `*🛒 COURTSIDE KITCHEN ORDER*\n` +
        `*Order #:* ${data.orderNumber || orderId}\n` +
        `*Customer:* ${data.customerName || 'Customer'}\n` +
        `*Payment:* ${data.paymentMethod || 'Online'}\n` +
        (data.notes ? `*Notes:* ${data.notes}\n` : '') +
        `--------------------------\n` +
        waItemsText +
        `--------------------------\n` +
        `*TOTAL: ₱${Number(data.total || 0).toLocaleString()}*\n\n` +
        `📍 Track live status:\n${window.location.origin}/track_rc1.html?order=${data.orderNumber || orderId}`;
      currentWaUrl = `https://wa.me/${STORE_WHATSAPP_NUMBER}?text=${encodeURIComponent(waMessage)}`;
    }

    const sRec = document.getElementById('step-rec');
    const sPrep = document.getElementById('step-prep');
    const sReady = document.getElementById('step-ready');
    const sDone = document.getElementById('step-done');
    const sBox = document.getElementById('statusBox');
    const sTitle = document.getElementById('statusTitle');
    const sDesc = document.getElementById('statusDesc');

    sBox.className = 'status-card';
    sRec.className = 'step-circle';
    sPrep.className = 'step-circle';
    sReady.className = 'step-circle';
    sDone.className = 'step-circle';

    if (rawStatus === 'PENDING' || rawStatus === 'ORDER_RECEIVED') {
      clearInterval(alarmInterval); alarmInterval = null;
      sRec.className = 'step-circle active';
      sTitle.textContent = 'Order Received';
      sDesc.textContent = 'Your order is queued and being sent to the kitchen.';
    } else if (rawStatus === 'PREPARING') {
      clearInterval(alarmInterval); alarmInterval = null;
      sRec.className = 'step-circle active';
      sPrep.className = 'step-circle active';
      sTitle.textContent = 'Preparing Your Order';
      sDesc.textContent = 'Our kitchen team is now preparing your delicious items!';
    } else if (rawStatus === 'READY_FOR_PICKUP' || rawStatus === 'READY FOR PICK UP' || rawStatus === 'READY') {
      if (!alarmInterval) {
        playPickupAlarm();
        alarmInterval = setInterval(playPickupAlarm, 4500);
      }
      sBox.className = 'status-card status-ready';
      sRec.className = 'step-circle active';
      sPrep.className = 'step-circle active';
      sReady.className = 'step-circle ready';
      sTitle.textContent = 'READY FOR PICK UP!';
      sDesc.textContent = 'Your order is freshly prepared and ready! Please claim it at the pickup counter.';
    } else if (rawStatus === 'COMPLETED') {
      clearInterval(alarmInterval); alarmInterval = null;
      sBox.className = 'status-card status-completed';
      sRec.className = 'step-circle done';
      sPrep.className = 'step-circle done';
      sReady.className = 'step-circle done';
      sDone.className = 'step-circle done';
      sTitle.textContent = 'Order Claimed';
      sDesc.textContent = 'Thank you for dining at Courtside Kitchen! Enjoy your meal.';
    }
  });
}

window.startNewOrder = () => {
  localStorage.removeItem('ck_active_order_id');
  if (trackerUnsubscribe) trackerUnsubscribe();
  clearInterval(alarmInterval);
  alarmInterval = null;
  window.location.href = 'index.html';
};
</script>
</body>
</html>

<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Courtside Kitchen</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa}header{background:#163a70;color:#fff;text-align:center;padding:15px;position:sticky;top:0}img.logo{max-width:220px;width:100%}.wrap{padding:12px;max-width:900px;margin:auto}.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0}.item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}.qty button{width:34px;height:34px}.cart{position:sticky;bottom:0;background:#fff;padding:12px;border-top:3px solid #ffd400}button.order{width:100%;padding:14px;background:#163a70;color:#fff;border:0;border-radius:8px}input,select{width:100%;padding:10px;margin:4px 0}</style></head><body><header><h1>Courtside Kitchen</h1><p>Replace logo.png, gcash.jpg and bpi.jpg with your uploaded images</p></header><div class='wrap'><div class='card'><img class='logo' src='logo.png' onerror="this.style.display='none'"></div><div id='menu'></div><div class='card'><h3>Customer Details</h3><input id='name' placeholder='Name'><input id='mobile' placeholder='Mobile Number'><select id='payment'><option>GCash</option><option>BPI</option><option>Cash</option></select><h3>Payment QR Codes</h3><img src='gcash.jpg' style='width:140px;margin-right:10px'><img src='bpi.jpg' style='width:140px'></div></div><div class='cart'><div id='summary'>No items selected</div><h2>Total ₱<span id='total'>0</span></h2><button class='order' onclick='orderNow()'>Order via Messenger</button></div><script>const PAGE='https://m.me/1282294331624336';const data=[['Mango Smash',150],['Melon Match Point',150],['Strawberry Rally',150],['Watermelon Winner',150],['Strawberry Serve Fizz',100],['Peach Drop Shot',100],['Sweet Spot Okinawa',100],['Grand Slam Choco',100],['Baseline Matcha',100],['Nutty Dink Delight',100],['Banana Serve',150],['Paddle Popper Combo',180],['Courtside Cheese Steak',270],['The Third Shot Sausage',150],['Hungarian Slice',100],['Sideout Sticks',120],['Golden Dink Fries',100],['Tapa Topspin Bowl',220],['Sweet Serve Tocino',200],['Spam Smash Bowl',200],['Slice Serve Sisig',200],['Hungarian Heavy Hit',180]];let c={};function r(){let h='<div class=card><h3>Menu</h3>';let t=0,s='';data.forEach(i=>{let q=c[i[0]]||0;h+=`<div class=item><span>${i[0]} ₱${i[1]}</span><span class=qty><button onclick="chg('${i[0]}',-1)">-</button> ${q} <button onclick="chg('${i[0]}',1)">+</button></span></div>`;if(q){t+=q*i[1];s+=i[0]+' x'+q+'<br>'}});h+='</div>';menu.innerHTML=h;summary.innerHTML=s||'No items selected';total.innerText=t;}function chg(n,v){c[n]=Math.max(0,(c[n]||0)+v);r()}function orderNow(){window.open(PAGE,'_blank')}r();</script></body></html>

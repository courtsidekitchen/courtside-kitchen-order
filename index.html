<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Courtside Kitchen v4</title>
<style>
body{font-family:Arial;background:#ececec;margin:0}.wrap{max-width:1100px;margin:auto;padding:12px}.card{background:#fff;padding:15px;border-radius:14px;margin-bottom:12px}.btn{background:#163a70;color:#fff;border:none;border-radius:12px;padding:18px;font-size:22px;font-weight:bold;width:100%}.plus{background:#28a745;color:#fff}.minus{background:#dc3545;color:#fff}.qbtn{width:44px;height:44px;border:none;border-radius:8px;font-weight:bold}.qty{font-size:18px;font-weight:bold;padding:0 12px}.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.success{background:#e8f5e9}
</style></head><body>
<div class='wrap'>
<div class='card'><h1>Courtside Kitchen</h1></div>
<div id='menu'></div>
<div class='card'>
<input id='customerName' placeholder='Name' style='width:100%;padding:10px'><br><br>
<textarea id='notes' placeholder='Special Requests / Notes' style='width:100%;height:80px'></textarea><br><br>
<select id='discount' onchange='recalc()' style='width:100%;padding:10px'>
<option value='0'>No Discount</option>
<option value='20'>Senior Citizen (20%)</option>
<option value='20'>PWD (20%)</option>
</select>
<p>ℹ️ Valid Senior Citizen/PWD ID must be attached with payment screenshot via WhatsApp.</p>
</div>
<div class='card'>
<div>Subtotal: ₱<span id='subtotal'>0</span></div>
<div style='color:green'>Discount: ₱<span id='discountAmt'>0</span></div>
<hr>
<div><b>Total: ₱<span id='grandTotal'>0</span></b></div>
<button class='btn' onclick='placeOrder()'>🍽️ PLACE ORDER</button>
</div>
<div id='result'></div>
</div>
<script type='module'>
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, onSnapshot, doc, setDoc, runTransaction } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyDRCXXhgQrMNan2lK-5WN1f5fcXBdzHj2I',authDomain:'courtside-kitchen.firebaseapp.com',projectId:'courtside-kitchen'});const db=getFirestore(app);
let products=[],cart={};
window.changeQty=(id,n)=>{cart[id]=Math.max(0,(cart[id]||0)+n);recalc();render();};
function render(){let h='';products.forEach(p=>{let q=cart[p.id]||0;h+=`<div class='card item'><div><b>${p.name}</b><br>₱${p.price||0}</div><div><button class='qbtn minus' onclick="changeQty('${p.id}',-1)">-</button><span class='qty'>${q}</span><button class='qbtn plus' onclick="changeQty('${p.id}',1)">+</button></div></div>`});menu.innerHTML=h;}
window.recalc=()=>{let sub=0;products.forEach(p=>sub+=(cart[p.id]||0)*(p.price||0));let disc=sub*(Number(discount.value||0)/100);subtotal.textContent=sub.toFixed(2);discountAmt.textContent=disc.toFixed(2);grandTotal.textContent=(sub-disc).toFixed(2);};
async function nextOrder(){const ref=doc(db,'counters','orders');let num=0;await runTransaction(db,async tx=>{const s=await tx.get(ref);num=(s.data()?.lastOrderNumber||0)+1;tx.update(ref,{lastOrderNumber:num});});return 'CK-'+String(num).padStart(4,'0');}
window.placeOrder=async()=>{let total=Number(grandTotal.textContent);if(!customerName.value||total<=0)return alert('Complete order first');const orderNo=await nextOrder();let items=[];products.forEach(p=>{let q=cart[p.id]||0;if(q)items.push({name:p.name,qty:q,price:p.price});});await setDoc(doc(db,'orders',orderNo),{orderNumber:orderNo,customerName:customerName.value,status:'PENDING',notes:notes.value,discountType:discount.options[discount.selectedIndex].text,total,items,createdAt:new Date().toISOString()});
result.innerHTML=`<div class='card success'><h3>✅ Order Created</h3><p>${orderNo}</p><div id='count'>30</div><button onclick="cancelOrder('${orderNo}')">Cancel Order</button><br><br><a target='_blank' href="https://wa.me/639178512376?text=${encodeURIComponent('Order '+orderNo+'\nPlease attach payment screenshot and ID if discount claimed.')} ">Open WhatsApp & Send Payment</a></div>`;
let x=30;let t=setInterval(async()=>{x--; let c=document.getElementById('count'); if(c)c.textContent='Cancellation Window: '+x+'s'; if(x<=0){clearInterval(t); await setDoc(doc(db,'orders',orderNo),{status:'ORDER_RECEIVED'},{merge:true}); if(c)c.parentElement.innerHTML+='<p>✅ Order sent to kitchen.</p>'; }},1000);
};
window.cancelOrder=async(id)=>{await setDoc(doc(db,'orders',id),{status:'CANCELLED',cancelledBy:'CUSTOMER'},{merge:true}); alert('Order cancelled');};
onSnapshot(collection(db,'products'),s=>{products=[];s.forEach(d=>products.push({id:d.id,...d.data()}));render();recalc();});
</script></body></html>

<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Courtside Kitchen RC2</title>
<style>
body{font-family:Arial;background:#ececec;margin:0}.container{max-width:1100px;margin:auto;padding:12px}.card{background:#fff;padding:14px;border-radius:14px;margin-bottom:12px}.category{background:#f5f5f5;padding:12px;border-radius:10px;cursor:pointer;font-weight:bold;display:flex;justify-content:space-between}.content{display:none;padding-top:10px}.content.open{display:block}.item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee}.item-info{flex:1}.item-name{font-weight:bold}.item-boba{font-size:12px;color:#666;display:block;margin-top:4px}.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}.item-price{color:#0066cc;font-weight:bold}.item-qty{display:flex;gap:6px;align-items:center}.item-qty button{padding:4px 8px;background:#0066cc;color:#fff;border:none;border-radius:4px;cursor:pointer}.item-qty input{width:40px;text-align:center;border:1px solid #ccc;border-radius:4px;padding:4px}.cart{background:#0066cc;color:#fff;padding:12px;border-radius:12px;margin:12px 0}.cart>div{padding:4px;display:flex;justify-content:space-between}.cart-total{font-size:24px;font-weight:bold;padding:8px 0;border-top:2px solid #fff}.btn{width:100%;padding:12px;background:#4caf50;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:8px}.btn:disabled{background:#ccc;cursor:not-allowed}.payment-details{background:#f0f0f0;padding:12px;border-radius:8px;margin-top:12px;border-left:4px solid #0066cc}.payment-details-title{font-weight:bold;margin-bottom:8px}.payment-details-item{padding:6px 0;font-size:14px}.payment-details-item label{font-weight:bold;color:#333}.payment-details-item span{color:#666}.payment-toggle{margin-top:12px;padding:12px;background:#fff3cd;border-radius:8px;border-left:4px solid #ff9800}.payment-toggle-label{font-weight:bold;margin-bottom:8px;display:block}.toggle-container{display:flex;gap:10px;align-items:center}.toggle-btn{padding:8px 16px;background:#ddd;border:none;border-radius:4px;cursor:pointer;font-weight:bold;transition:all 0.3s}.toggle-btn.active{background:#4caf50;color:#fff}.toggle-status{font-size:14px;margin-left:10px}
.header{text-align:center;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:8px}
.header img{width:120px;height:120px;object-fit:contain;mix-blend-mode:multiply}
.header h1{margin:0;color:#0066cc;font-size:26px}
.qr-download-link{display:inline-block;text-decoration:none;margin-top:8px}
.qr-download-link small{color:#0066cc;font-weight:bold;display:block;margin-top:4px}
</style></head><body>
<div class='container'>
<div class="header">
  <img src="logo.png" alt="Courtside Kitchen Logo" onerror="this.style.display='none'">
  <h1>Courtside Kitchen</h1>
</div>
<div id='menu'></div>
<div class='card'>
<input id='customerName' placeholder='Name' style='width:100%;padding:10px'><br><br>
<textarea id='notes' placeholder='Special requests' style='width:100%;height:70px'></textarea><br><br>
<select id='paymentMethod' onchange='updatePaymentInfo()' style='width:100%;padding:10px'>
<option value='GCash'>GCash</option><option value='BPI'>BPI</option></select>
<br><br>
<a id='paymentDownloadLink' href='GCASH.jpg' download='Payment_QR.jpg' class='qr-download-link'>
  <img id='paymentImage' src='GCASH.jpg' style='max-width:250px;width:100%;border-radius:12px;cursor:pointer'>
  <small>📥 Tap image to download QR code</small>
</a>
<div class='payment-details'>
<div class='payment-details-title' id='paymentMethodTitle'>GCash Payment Details</div>
<div class='payment-details-item'>
<label>Account Name:</label>
<span id='accountName'>PA****K NI**O L.</span>
</div>
<div class='payment-details-item'>
<label>Mobile Number:</label>
<span id='accountNumber'>09178512376</span>
</div>
</div>
<div class='payment-toggle'>
<label class='payment-toggle-label'>💳 Payment Made?</label>
<div class='toggle-container'>
<button class='toggle-btn' id='paymentYes' onclick='setPaymentStatus(true)'>✓ Yes</button>
<button class='toggle-btn active' id='paymentNo' onclick='setPaymentStatus(false)'>✗ No</button>
<span class='toggle-status' id='paymentStatus'>Awaiting payment...</span>
</div>
</div>
</div>
<div class='cart'><div id='summary'>No items selected</div><div>Subtotal ₱<span id='sub'>0</span></div><div class='cart-total'>Total ₱<span id='tot'>0</span></div><button id='placeOrderBtn'
class='btn'
disabled
onclick='placeOrder()'>
🍽️ PLACE ORDER
</button>
</div><div id='success'></div></div>
<script type='module'>
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,collection,onSnapshot,doc,runTransaction,setDoc,updateDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyDRCXXhgQrMNan2lK-5WN1f5fcXBdzHj2I',authDomain:'courtside-kitchen.firebaseapp.com',projectId:'courtside-kitchen'});const db=getFirestore(app);
let products=[],cart={},bobaMap={},openCats=new Set(),paymentMade=false;
const paymentMethods={
GCash:{
title:'GCash Payment Details',
image:'GCASH.jpg',
accountName:'PA****K NI**O L.',
accountNumber:'09178512376'
},
BPI:{
title:'BPI Payment Details',
image:'BPI.jpg',
accountName:'PA****K NI**O LA***O.',
accountNumber:'0846454643'
}
};
window.updatePaymentInfo=()=>{
const method=document.getElementById('paymentMethod').value;
const paymentInfo=paymentMethods[method];
document.getElementById('paymentImage').src=paymentInfo.image;
document.getElementById('paymentDownloadLink').href=paymentInfo.image;
document.getElementById('paymentMethodTitle').textContent=paymentInfo.title;
document.getElementById('accountName').textContent=paymentInfo.accountName;
document.getElementById('accountNumber').textContent=paymentInfo.accountNumber;
};
window.setPaymentStatus=(status)=>{
paymentMade=status;
const btnYes=document.getElementById('paymentYes');
const btnNo=document.getElementById('paymentNo');
const statusText=document.getElementById('paymentStatus');
const placeOrderBtn=document.getElementById('placeOrderBtn');
if(status){
btnYes.classList.add('active');
btnNo.classList.remove('active');
statusText.textContent='Payment received ✓';
placeOrderBtn.disabled=false;
}else{
btnNo.classList.add('active');
btnYes.classList.remove('active');
statusText.textContent='Awaiting payment...';
placeOrderBtn.disabled=true;
}
};
window.toggleCat=id=>{openCats.has(id)?openCats.delete(id):openCats.add(id);document.getElementById(id)?.classList.toggle('open');};
window.q=(id,n)=>{cart[id]=Math.max(0,(cart[id]||0)+n);calc();render();};
window.tb=id=>{bobaMap[id]=!bobaMap[id];calc();render();};
function buildItems(){const items=[];products.forEach(p=>{const q=cart[p.id]||0;if(q)items.push({name:p.name,qty:q,price:p.price||0,boba:!!bobaMap[p.id]})});return items;}
function calc(){let s=0,t='';products.forEach(p=>{let q=cart[p.id]||0;if(q){let itemTotal=q*(p.price||0);if(bobaMap[p.id])itemTotal+=q*5;s+=itemTotal;t+=`${p.name} x${q}${bobaMap[p.id]?' + Boba':''}\n`;}});sub.textContent=s;tot.textContent=s;summary.textContent=t||'No items selected';}
function render(){
 
let g={},h='';
 
products.forEach(
p => (g[p.category || 'Other'] ??= []).push(p)
);
 
const categoryOrder = [
'Fruit Shakes',
'Fruit Sodas',
'Milk Tea',
'Power Plays',
'Quick Points'
];
 
const orderedCategories = [
...categoryOrder.filter(c => g[c]),
...Object.keys(g).filter(
c => !categoryOrder.includes(c)
)
];
 
for(const c of orderedCategories){
 
let id =
c.toLowerCase()
.replace(/[^a-z0-9]+/g,'-');

let isMilkTea = c.toLowerCase() === 'milk tea';
 
h+=`<div class='card'><div class='category' onclick="toggleCat('${id}')"><span>${c}</span><span>${g[c].length}</span></div><div id='${id}' class='content ${openCats.has(id)?'open':''}'>`;g[c].forEach(p=>{h+=`<div class='item'><div class='item-info'><div class='item-name'>${p.name}</div>${isMilkTea ? `<label class='item-boba'><input type='checkbox' ${bobaMap[p.id]?'checked':''} onchange="tb('${p.id}')"> Boba +₱5</label>` : ''}</div><div class='item-right'><div class='item-price'>₱${p.price}</div><div class='item-qty'><button onclick="q('${p.id}',-1)">-</button><input type='number' value='${cart[p.id]||0}' readonly><button onclick="q('${p.id}',1)">+</button></div></div></div>`});h+='</div></div>';}
menu.innerHTML=h;
}
async function nextOrder(){const ref=doc(db,'counters','orders');let n=0;await runTransaction(db,async tx=>{const s=await tx.get(ref);n=(s.data()?.lastOrderNumber||0)+1;tx.update(ref,{lastOrderNumber:n});});return n;}
window.placeOrder=async()=>{
 
if(!paymentMade){
alert('Please confirm payment has been made before placing order');
return;
}
 
document.getElementById('placeOrderBtn').style.display='none';
 
if(!customerName.value)
return alert('Enter name');const items=buildItems();if(!items.length)return alert('Select items');const orderNo=await nextOrder();const track=`track_rc1.html?order=${orderNo}`;const order={orderNumber:orderNo,customerName:customerName.value,notes:notes.value,items:items,paymentMethod:document.getElementById('paymentMethod').value,total:Number(document.getElementById('tot').textContent),status:'PENDING',createdAt:new Date().toISOString(),trackingLink:track};await setDoc(doc(db,'orders',orderNo.toString()),order);const wa=`Order #${orderNo}\n${items.map(i=>`${i.name} x${i.qty}${i.boba?' + Boba':''}`).join('\n')}\nTotal: ₱${order.total}\n\n${track}`;const whatsappUrl=
`https://wa.me/639178512376?text=${encodeURIComponent(wa)}`;
 
window.location.href = whatsappUrl;success.innerHTML=`<div class='card'><h3>✅ ${orderNo}</h3><p>Status:<span id='orderStatus'>PENDING</span></p><p>Cancel window:<span id='timer'>30</span>s</p><b>Tracking: ${track}</b></div>`;let seconds=30;const timer=setInterval(()=>{document.getElementById('timer').textContent=--seconds;if(seconds<0)clearInterval(timer);},1000);
};
window.cancelOrder=async(id)=>{await updateDoc(doc(db,'orders',id),{status:'CANCELLED',cancelledBy:'CUSTOMER'});alert('Cancelled');};
onSnapshot(collection(db,'products'),s=>{products=[];s.forEach(d=>products.push({id:d.id,...d.data()}));render();calc();});
</script></body></html>

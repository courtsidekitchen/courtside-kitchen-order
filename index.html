<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Courtside Kitchen V5</title></head><body><h2>V5 Payment Upload Components</h2><div id='paymentProofContainer'><label>Upload Payment Confirmation</label><input type='file' id='paymentProof' accept='image/*' onchange='previewImage(event)'><div id='previewContainer' style='display:none;margin-top:10px'><img id='paymentPreview' style='max-width:300px;width:100%;border:1px solid #ccc;border-radius:10px'><br><button type='button' onclick='replaceImage()'>🔄 Replace Image</button><button type='button' onclick='removeImage()'>🗑 Remove Image</button></div></div><script>function previewImage(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(x){paymentPreview.src=x.target.result;previewContainer.style.display='block';};r.readAsDataURL(f);}function removeImage(){paymentProof.value='';paymentPreview.src='';previewContainer.style.display='none';}function replaceImage(){paymentProof.click();}</script></body></html>

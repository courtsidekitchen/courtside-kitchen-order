<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Courtside Kitchen</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa}.logoWrap{text-align:center;background:#fff;padding:20px}.logo{width:85%;max-width:420px;height:auto}.container{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}h2{color:#163a70}h3{color:#2f855a}.item{border-bottom:1px solid #eee;padding:10px 0}.desc{font-size:13px;color:#666}.price{font-weight:bold}.qty button{width:34px;height:34px}.cart{position:sticky;bottom:0;background:#fff;padding:12px;border-top:4px solid #163a70}.order{width:100%;padding:14px;background:#163a70;color:#fff;border:none;border-radius:10px;font-size:18px}input,select{width:100%;padding:10px;margin:6px 0}.qr{width:220px;max-width:100%}.hidden{display:none}.progress{height:16px;background:#ddd;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#163a70}.pay{background:#f8fafc;padding:10px;border-radius:8px;margin-top:8px}</style></head><body><div class='logoWrap'><img class='logo' src='logo.png' onerror="this.style.display='none'"></div><div class='container'><div id='menu'></div><div class='card'><h2>Location</h2><select id='location'><option>VIP Court 1</option><option>VIP Court 2</option><option>VIP Lounge</option></select><input id='name' placeholder='Name'><input id='mobile' placeholder='Mobile Number'><select id='payment' onchange='payChange()'><option>GCash</option><option>BPI</option><option>Cash</option></select><div id='gcash'><img class='qr' src='GCASH.jpg'><div class='pay'><b>GCash</b><br>PA****K NI**O L.<br>09178512376</div></div><div id='bpi' class='hidden'><img class='qr' src='BPI.jpg'><div class='pay'><b>BPI</b><br>PA****K NI**O LA***O.<br>0846454643</div></div><input id='ref' placeholder='Payment Reference Number'></div></div><div class='cart'><div id='summary'>No items selected</div><h2>Total ₱<span id='total'>0</span></h2><button id='btn' class='order' onclick='placeOrder()'>🍽️ PLACE ORDER</button><div id='loader' class='hidden'><p>Preparing your order...</p><div class='progress'><div id='bar' class='bar'></div></div><button onclick='cancelOrder()'>Cancel</button></div><div id='success' class='hidden'>✅ Messenger opened. Please tap SEND.</div></div><script>const PAGE='https://m.me/1282294331624336';const menu={'🥤 Refresh Between Sets':{'Fruit Shakes':[['Mango Smash','Mango Shake',150],['Melon Match Point','Melon Shake',150],['Strawberry Rally','Strawberry Yoghurt Shake',150],['Watermelon Winner','Watermelon Shake',150],['Banana Serve','Banana Shake',150]],'Fruit Soda':[['Strawberry Serve Fizz','Strawberry Fruit Soda',100],['Peach Drop Shot','Peach Fruit Soda',100]],'Milk Tea':[['Sweet Spot Okinawa','Okinawa Milk Tea',95,true],['Grand Slam Choco','Chocolate Milk Tea',95,true],['Baseline Matcha','Matcha Milk Tea',95,true],['Nutty Dink Delight','Nutella Milk Tea',95,true]]},'🍟 Quick Points':{'Snacks':[['Paddle Popper Combo','Chicken Poppers & Fries',180],['Courtside Cheese Steak','Philly Cheese Steak',270,'choice'],['The Third Shot Sausage','Hungarian Sausage Sandwich',150],['Hungarian Slice','Sliced Hungarian Sausage',100],['Sideout Sticks','Cheese Sticks',120],['Golden Dink Fries','Cheesy French Fries',100]]},'🍚 Power Plays':{'Rice Bowls':[['Tapa Topspin Bowl','Tapa Rice Bowl',220],['Sweet Serve Tocino','Tocino Rice Bowl',200],['Spam Smash Bowl','Teriyaki Spam Rice Bowl',200],['Slice Serve Sisig','Sisig Rice Bowl',200],['Hungarian Heavy Hit','Hungarian Sausage Rice Bowl',180]]}};let cart={};function render(){let h='',t=0,s='';for(let cat in menu){h+=`<div class=card><h2>${cat}</h2>`;for(let sub in menu[cat]){h+=`<h3>${sub}</h3>`;menu[cat][sub].forEach(i=>{let q=cart[i[0]]?.qty||0;h+=`<div class=item><b>${i[0]}</b><div class=desc>${i[1]}</div><div class=price>₱${i[2]}</div>`;if(i[3]===true)h+=`<label><input type=checkbox onchange="toggleBoba('${i[0]}',this.checked)"> Add Boba (+₱5)</label><br>`;if(i[3]==='choice')h+=`<select onchange="setChoice('${i[0]}',this.value)"><option>Sandwich</option><option>Rice Bowl</option></select>`;h+=`<div class=qty><button onclick="chg('${i[0]}',-1)">-</button> ${q} <button onclick="chg('${i[0]}',1)">+</button></div></div>`;if(q){let p=i[2]+(cart[i[0]]?.boba?5:0);let line=q*p;t+=line;s+=`${i[0]}${cart[i[0]]?.choice?(' ('+cart[i[0]].choice+')'):''}${cart[i[0]]?.boba?' + Boba':''} x${q}<br>`}})}}menu.innerHTML=h;summary.innerHTML=s||'No items selected';total.innerText=t}function chg(n,v){cart[n]=cart[n]||{qty:0};cart[n].qty=Math.max(0,cart[n].qty+v);render()}function toggleBoba(n,v){cart[n]=cart[n]||{qty:0};cart[n].boba=v}function setChoice(n,v){cart[n]=cart[n]||{qty:0};cart[n].choice=v}function payChange(){gcash.classList.toggle('hidden',payment.value!=='GCash');bpi.classList.toggle('hidden',payment.value!=='BPI');ref.style.display=payment.value==='Cash'?'none':'block'}let iv,to;function placeOrder(){btn.style.display='none';loader.classList.remove('hidden');let p=0;iv=setInterval(()=>{p+=2;bar.style.width=p+'%'},100);to=setTimeout(()=>{loader.classList.add('hidden');success.classList.remove('hidden');window.open(PAGE,'_blank');btn.style.display='block';},5000)}function cancelOrder(){clearInterval(iv);clearTimeout(to);loader.classList.add('hidden');bar.style.width='0%';btn.style.display='block'}payChange();render();</script></body></html>
